name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    env:
      # GitHub's macOS runners have no Metal device; the GPU checks run locally.
      OCEAN_SKIP_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (the newest Xcode on the runner, as the app is developed with)
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Checks
        run: swift run -c release OceanChecks
      - name: Build the universal app
        run: Tools/build.sh
