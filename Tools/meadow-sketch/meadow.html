<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Meadow Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Panel tokens. The meadow itself is drawn on the canvas with the app's own colours. */
:root {
  --page: #f7f6f3;
  --panel: rgba(250, 249, 246, 0.9);
  --panel-edge: rgba(35, 35, 35, 0.12);
  --fg: #232323;
  --muted: #6c6f68;
  --faint: #9a9d96;
  --track: rgba(35, 35, 35, 0.16);
  --fill: #4f7a3e;
  --chip: rgba(35, 35, 35, 0.06);
  --chip-on: rgba(79, 122, 62, 0.16);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #000;
    --panel: rgba(12, 14, 12, 0.86);
    --panel-edge: rgba(255, 255, 255, 0.09);
    --fg: #e4e7e1;
    --muted: #8f968c;
    --faint: #5f665c;
    --track: rgba(255, 255, 255, 0.14);
    --fill: #9cc987;
    --chip: rgba(255, 255, 255, 0.05);
    --chip-on: rgba(156, 201, 135, 0.16);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #000;
  --panel: rgba(12, 14, 12, 0.86);
  --panel-edge: rgba(255, 255, 255, 0.09);
  --fg: #e4e7e1;
  --muted: #8f968c;
  --faint: #5f665c;
  --track: rgba(255, 255, 255, 0.14);
  --fill: #9cc987;
  --chip: rgba(255, 255, 255, 0.05);
  --chip-on: rgba(156, 201, 135, 0.16);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; }
body { font-family: "Geist Mono", ui-monospace, Menlo, monospace; color: var(--fg); -webkit-font-smoothing: antialiased; }
canvas#meadow { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: crosshair; }

#toggle {
  position: fixed; top: 14px; right: 14px; z-index: 3;
  font: 500 12px/1 "Geist Mono", monospace; letter-spacing: 0.02em;
  color: var(--fg); background: var(--panel); border: 1px solid var(--panel-edge);
  border-radius: 999px; padding: 9px 14px; cursor: pointer; box-shadow: var(--shadow);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
#toggle:hover { border-color: var(--faint); }
#panel {
  position: fixed; top: 56px; right: 14px; bottom: 14px; z-index: 2; width: 348px;
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px;
  box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: opacity .18s ease, transform .18s ease;
}
#panel.hidden { opacity: 0; transform: translateX(12px); pointer-events: none; }
#panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--panel-edge); }
#panel h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
#panel header p { margin: 0; font-size: 11px; line-height: 1.45; color: var(--muted); }
#controls { overflow-y: auto; padding: 4px 16px 8px; flex: 1; scrollbar-width: thin; }
.group h2 { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 16px 0 8px; }
.row { margin: 0 0 12px; }
.row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row label { font-size: 12px; font-weight: 500; flex: 1; }
.rs { flex: none; width: 22px; height: 20px; padding: 0; font: 500 12px/1 "Geist Mono", ui-monospace, monospace; color: var(--muted); background: transparent; border: 1px solid var(--panel-edge); border-radius: 6px; cursor: pointer; align-self: center; }
.rs:hover:not(:disabled) { color: var(--fg); border-color: var(--faint); }
.rs:focus-visible { outline: 2px solid var(--fill); outline-offset: 1px; }
.rs:disabled { opacity: 0.28; cursor: default; }
.row output { font-size: 11px; color: var(--fill); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .hint { font-size: 10.5px; line-height: 1.4; color: var(--faint); margin-top: 3px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 4px 0 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--fill) var(--p, 50%), var(--track) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--fill); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--fg); margin-top: -5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--fg); border: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font: 500 11px/1 "Geist Mono", monospace; color: var(--muted); background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 7px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; opacity: .35; }
.chip.on { color: var(--fg); background: var(--chip-on); border-color: var(--panel-edge); }
.chip.on i { opacity: 1; }
#panel footer { border-top: 1px solid var(--panel-edge); padding: 10px 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#panel footer button { font: 500 11px/1 "Geist Mono", monospace; color: var(--fg); background: var(--chip); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
#panel footer button:hover { border-color: var(--faint); }
#panel footer button.primary { background: var(--chip-on); }
#stats { margin-left: auto; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  #toggle { top: 10px; right: 10px; }
  #panel { top: auto; left: 16px; right: 16px; bottom: 16px; width: auto; max-height: 62vh; }
  #panel.hidden { transform: translateY(12px); }
}
</style>
</head>
<body>
<canvas id="meadow" aria-label="An ASCII meadow seen from above, with butterflies"></canvas>
<button id="toggle" type="button" aria-expanded="true" aria-controls="panel">Hide tweaks</button>
<aside id="panel" aria-label="Meadow settings">
  <header>
    <h1>Meadow sketch</h1>
    <p>Drag across the meadow to stir the breeze; click to bloom a flower. Values here are what we port to the app.</p>
  </header>
  <div id="controls"></div>
  <footer>
    <button type="button" id="copy" class="primary">Copy settings</button>
    <button type="button" id="reset" title="Every value back to its default">Reset all</button>
    <button type="button" id="replant">New meadow</button>
    <button type="button" id="pause">Pause</button>
    <span id="stats"></span>
  </footer>
</aside>
<script>
(() => {
'use strict';

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Basics
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const params = new URLSearchParams(location.search);

let seed = params.has('seed') ? (+params.get('seed') | 0) : ((Math.random() * 1e6) | 0);
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
let rnd = mulberry32(seed);
const R = (a, b) => a + (b - a) * rnd();
const RI = (a, b) => Math.floor(a + (b - a + 1) * rnd());
function gauss() { const a = Math.max(rnd(), 1e-12), b = rnd(); return Math.sqrt(-2 * Math.log(a)) * Math.cos(TAU * b); }

/** A stable hash of three integers to [0, 1). */
function hash3(x, y, z) {
  let h = (Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
/** Smooth value noise in [0, 1]. */
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let xf = x - xi, yf = y - yi; xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
  const a = hash3(xi, yi, s), b = hash3(xi + 1, yi, s), c = hash3(xi, yi + 1, s), d = hash3(xi + 1, yi + 1, s);
  return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
}
const n1 = (t, s) => vnoise(t, 0.5, s) * 2 - 1;

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Settings: every slider the director plays with. `def` is the default; the panel is built from this list.
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const SPECIES_LIST = [
  { key: 'monarch', label: 'Monarch', swatch: '#c8641e' },
  { key: 'morpho', label: 'Morpho', swatch: '#3a78d0' },
  { key: 'swallowtail', label: 'Swallowtail', swatch: '#d4b844' },
  { key: 'white', label: 'Cabbage white', swatch: '#dcdacb' },
];

const f2 = v => (+v).toFixed(2), x2 = v => (+v).toFixed(2) + ' ×';
const CONTROLS = [
  { group: 'Butterflies', items: [
    { k: 'count', label: 'How many', min: 1, max: 12, step: 1, def: 4, fmt: v => String(v),
      hint: 'Butterflies on screen at once. You asked for few.' },
    { k: 'sizeLow', label: 'Size down on the flowers', min: 0.2, max: 1.5, step: 0.01, def: 0.75, fmt: x2,
      hint: 'Drawn size at ground level, as a share of the species size (a monarch is 22 cells across at 1 ×).' },
    { k: 'sizeHigh', label: 'Size up close', min: 0.4, max: 2.5, step: 0.01, def: 1.4, fmt: x2,
      hint: 'Drawn size at the top of their flight, nearest you. The gap between the two is the depth.' },
    { k: 'species', type: 'species', label: 'Species' },
  ] },
  { group: 'Flight', items: [
    { k: 'wingbeat', label: 'Wingbeat speed', min: 0.1, max: 1, step: 0.01, def: 0.5,
      fmt: v => f2(v) + ' × real · monarch ' + beatHz('monarch', v).toFixed(1) + ' Hz',
      hint: 'Share of the real wingbeat (the app today: 0.28, capped at 3 Hz). Capped at 7.5 Hz, 4 frames a beat at 30 fps.' },
    { k: 'lurch', label: 'Lurch on the downstroke', min: 0, max: 2, step: 0.01, def: 1, fmt: x2,
      hint: 'The push forward each downstroke gives: the jerky, beat-by-beat pace of a real butterfly.' },
    { k: 'zigzag', label: 'Zig-zag', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'Jinks and side-slips at each wingbeat (the cabbage white most, the monarch least).' },
    { k: 'glide', label: 'Gliding', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'How often and how long they stop beating and sail with wings flat, sinking toward the flowers.' },
    { k: 'speed', label: 'Travel speed', min: 0.3, max: 2.5, step: 0.01, def: 1, fmt: x2,
      hint: 'How fast they cross the screen (1 × is the measured cruise at screen scale).' },
    { k: 'turning', label: 'Turning', min: 0.2, max: 2, step: 0.01, def: 1, fmt: x2,
      hint: 'How quickly they swing round to face where they fly.' },
    { k: 'bob', label: 'Bob', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'The rise on each downstroke, seen from above as a pulse in size and shadow.' },
    { k: 'height', label: 'Time spent high vs low', min: 0, max: 1, step: 0.01, def: 0.5,
      fmt: v => v < 0.34 ? f2(v) + ' · mostly low' : v > 0.66 ? f2(v) + ' · mostly high' : f2(v) + ' · both',
      hint: '0 keeps them down among the flowers, 1 up close to you.' },
  ] },
  { group: 'Visits', items: [
    { k: 'visits', label: 'Flower visits', min: 0, max: 1, step: 0.01, def: 0.35, fmt: f2,
      hint: 'Chance they head for a flower when they arrive somewhere, rather than travel on.' },
    { k: 'stay', label: 'How long they stay', min: 0, max: 1.5, step: 0.01, def: 0.25,
      fmt: v => x2(v) + ' · monarch ' + Math.round(10 * v) + '–' + Math.round(40 * v) + ' s',
      hint: 'Share of the real time spent on a flower or basking (monarch 10–40 s at 1 ×).' },
    { k: 'bask', label: 'Basking', min: 0, max: 1, step: 0.01, def: 0.1, fmt: f2,
      hint: 'Chance they settle on the ground with wings open flat instead of travelling on.' },
  ] },
  { group: 'Flowers', items: [
    { k: 'density', label: 'Flower density', min: 0.2, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'How many planted patches across the screen.' },
    { k: 'flowerSize', label: 'Flower size', min: 0.4, max: 2, step: 0.01, def: 1.15, fmt: x2,
      hint: 'Size of the blooms (a daisy is about 11 cells across at 1 ×).' },
    { k: 'leaves', label: 'Leaves', min: 0, max: 2, step: 0.01, def: 1, fmt: x2,
      hint: 'The dark rosettes of leaves under each bloom.' },
  ] },
  { group: 'Air and ground', items: [
    { k: 'breeze', label: 'Breeze', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'Gusts that ripple through the grass, sway the flowers and drift the butterflies.' },
    { k: 'shadow', label: 'Shadows', min: 0, max: 1.5, step: 0.01, def: 1, fmt: x2,
      hint: 'How dark the shadows are; a high butterfly casts a fainter, farther one.' },
    { k: 'green', label: 'Green in the ground', min: 0, max: 2.5, step: 0.01, def: 1, fmt: x2,
      hint: 'The hints of green in the black ground.' },
    { k: 'grass', label: 'Grass', min: 0, max: 2, step: 0.01, def: 1, fmt: x2,
      hint: 'How many grass marks, and how bright.' },
  ] },
  { group: 'Look', items: [
    { k: 'sparkle', label: 'Sparkle', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'The hide shimmer the sharks and spiders have: each cell re-rolls about 2.4 times a second, and a few take one of the family\'s seven accent colours or a white fleck. Flowers twinkle at half the rate. Accents are off on paper, as the spiders.' },
  ] },
  { group: 'View', items: [
    { k: 'timeScale', label: 'Slow motion', min: 0.05, max: 1.5, step: 0.01, def: 1,
      fmt: v => v >= 0.995 && v <= 1.005 ? '1 × (real time)' : x2(v),
      hint: 'Time scale for watching the wingbeat closely; 1 × is the speed the app runs.' },
    { k: 'theme', type: 'choice', label: 'Theme', options: [['dark', 'Dark'], ['light', 'Light']], def: 'dark' },
    { k: 'calm', type: 'toggle', label: 'Calm', def: false, hint: 'Dims everything, as the app\'s Calm does.' },
    { k: 'grid', type: 'toggle', label: 'Grid lines', def: true, hint: 'The faint cell grid the app draws.' },
  ] },
];

const DEFAULTS = { species: { monarch: true, morpho: true, swallowtail: true, white: true } };
for (const g of CONTROLS) for (const c of g.items) if (c.k !== 'species') DEFAULTS[c.k] = c.def;
const STORE = 'meadow-sketch-settings-v1';
let set = JSON.parse(JSON.stringify(DEFAULTS));
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved && typeof saved === 'object') {
    for (const k in DEFAULTS) if (k in saved && typeof saved[k] === typeof DEFAULTS[k]) set[k] = saved[k];
  }
} catch (e) { /* storage blocked: defaults */ }
if (params.get('defaults') === '1') set = JSON.parse(JSON.stringify(DEFAULTS));
if (params.has('theme')) set.theme = params.get('theme') === 'light' ? 'light' : 'dark';
for (const [k, v] of params) if (k.startsWith('s.') && k.slice(2) in DEFAULTS) set[k.slice(2)] = +v;
function save() { try { localStorage.setItem(STORE, JSON.stringify(set)); } catch (e) { /* ignore */ } }

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Species: the measured numbers (ButterflySpecies.swift, research §1) and the drawn look (MeadowPainter.swift)
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

/** Wing outlines, x outward in half-spans (0 at the body), y along the body in half-heights (+ toward the head).
 *  Edge kinds: 0 root (along the body), 1 costa (leading edge), 2 outer margin, 3 inner margin. */
const ROOT = 0, COSTA = 1, OUTER = 2, INNER = 3;
function outline(pts, kinds) {
  const p = new Float64Array(pts.flat()); let minY = 1e9, maxY = -1e9, maxX = 0;
  for (let i = 0; i < pts.length; i++) { minY = Math.min(minY, pts[i][1]); maxY = Math.max(maxY, pts[i][1]); maxX = Math.max(maxX, pts[i][0]); }
  return { p, k: Int8Array.from(kinds), n: pts.length, minY, maxY, maxX };
}
const FK = [COSTA, COSTA, COSTA, OUTER, OUTER, OUTER, INNER, INNER, ROOT];
const HK = [COSTA, COSTA, OUTER, OUTER, OUTER, OUTER, INNER, INNER, ROOT];
const SHAPES = {
  monarch: { fore: outline([[0.03, 0.34], [0.30, 0.62], [0.62, 0.88], [0.92, 1.00], [1.00, 0.80], [0.92, 0.40], [0.74, 0.00], [0.40, -0.12], [0.03, -0.10]], FK),
             hind: outline([[0.03, 0.06], [0.38, 0.06], [0.58, -0.12], [0.68, -0.36], [0.64, -0.62], [0.50, -0.86], [0.28, -0.98], [0.12, -0.88], [0.04, -0.56]], HK), tailY: -9 },
  morpho: { fore: outline([[0.03, 0.34], [0.34, 0.70], [0.68, 0.94], [0.90, 0.98], [1.00, 0.72], [0.96, 0.34], [0.80, -0.02], [0.40, -0.12], [0.03, -0.10]], FK),
            hind: outline([[0.03, 0.06], [0.44, 0.06], [0.64, -0.12], [0.76, -0.36], [0.72, -0.64], [0.54, -0.88], [0.30, -1.00], [0.10, -0.90], [0.04, -0.54]], HK), tailY: -9 },
  swallowtail: { fore: outline([[0.03, 0.34], [0.34, 0.66], [0.68, 0.90], [0.96, 1.02], [0.98, 0.78], [0.86, 0.36], [0.72, -0.02], [0.38, -0.12], [0.03, -0.10]], FK),
                 hind: outline([[0.03, 0.06], [0.40, 0.06], [0.58, -0.12], [0.68, -0.36], [0.62, -0.68], [0.56, -1.40], [0.44, -1.40], [0.40, -0.88], [0.20, -0.94], [0.08, -0.84], [0.04, -0.54]],
                               [COSTA, COSTA, OUTER, OUTER, OUTER, OUTER, OUTER, OUTER, INNER, INNER, ROOT]), tailY: -0.92 },
  white: { fore: outline([[0.03, 0.34], [0.34, 0.72], [0.66, 0.96], [0.88, 0.96], [1.00, 0.66], [0.94, 0.28], [0.74, -0.02], [0.38, -0.12], [0.03, -0.10]], FK),
           hind: outline([[0.03, 0.06], [0.40, 0.06], [0.58, -0.12], [0.70, -0.38], [0.64, -0.66], [0.46, -0.90], [0.24, -0.98], [0.08, -0.88], [0.04, -0.54]], HK), tailY: -9 },
};

const rgb = (r, g, b) => [r, g, b];
/** Species. Sizes in cells at 13 × 19 pt; speeds in pt/s at that cell; angles in degrees. `top`/`bottom` are the
 *  wing's stroke extremes (deg above level): the stroke runs top → bottom → top each beat, and seen from above a
 *  wing raised by φ is drawn cos φ wide. `aspect` is the drawn fore-aft height over the wingspan. */
const SPECIES = {
  monarch: { span: 22, aspect: 0.6, realBeat: 9.5, top: 80, bottom: -16, cruise: 170, forage: 80, surge: 0, thrust: 0.9,
    bout: [3, 8], glideS: [1.5, 5], glideWidth: 0.95, jinkChance: 0.12, jinkSigma: 12, slip: 0.35, headingK: 30, zeta: 0.9,
    bob: 0.25, maxBank: 35, bound: false, nectar: [10, 40], bask: [10, 40], baskPose: 'open', flutterOnFlower: false,
    flowers: { milkweed: 3, coneflower: 2, clover: 1, daisy: 1 }, flush: 4.5 },
  morpho: { span: 26, aspect: 0.5, realBeat: 6, top: 82, bottom: -18, cruise: 150, forage: 70, surge: 0, thrust: 0.9,
    bout: [4, 10], glideS: [0.6, 2], glideWidth: 1, jinkChance: 0.30, jinkSigma: 30, slip: 0.7, headingK: 35, zeta: 0.85,
    bob: 0.35, maxBank: 50, bound: true, nectar: [20, 60], bask: [20, 90], baskPose: 'closed', flutterOnFlower: false,
    flowers: {}, flush: 3.5 },

  const reach = Math.max(POSE.hs, POSE.hh * 1.5) + cw;
  const c0 = Math.max(0, Math.floor((POSE.cx - reach) / cw)), c1 = Math.min(cols - 1, Math.floor((POSE.cx + reach) / cw));
  const r0 = Math.max(0, Math.floor((POSE.cy - reach) / ch)), r1 = Math.min(rows - 1, Math.floor((POSE.cy + reach) / ch));
  // Softer the higher it flies: the samples spread wider.
  const spread = 0.3 + 0.9 * b.z;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const px = (c + 0.5) * cw, py = (r + 0.5) * ch;
    let cov = 0;
    for (let k = 0; k < 9; k++) if (wingTest(px + SUB9[k][0] * cw * spread * 1.5, py + SUB9[k][1] * ch * spread * 1.5) >= 0) cov++;
    // The body's shadow too.
    const dx = px - POSE.cx, dy = py - POSE.cy, u = dx * POSE.fx + dy * POSE.fy, v = dx * POSE.rx + dy * POSE.ry;
    if (Math.abs(v) < 0.5 * cw && u < 0.4 * POSE.hh && u > -0.78 * POSE.hh) cov = Math.max(cov, 6);
    if (cov) shade(r * cols + c, k0 * cov / 9);
  }
}

function drawDust() {
  const g = LIGHT ? GOLD_PAPER : PI_.gold;
  for (const d of dust) {
    const c = Math.floor(d.x / cw), r = Math.floor(d.y / ch); if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
    const a = clamp(d.life / d.max, 0, 1);
    const twinkle = d.spark ? (hash3(c, r, Math.floor(simT * 6)) < 0.5 ? G['+'] : G['·']) : (a > 0.5 ? G['·'] : G['.']);
    glyphAt(r * cols + c, twinkle, g[0], g[1], g[2], (d.spark ? 1 : 0.8) * a * set_accent());
  }
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  The ground: mainly black, slow patches of green, grass marks that ripple and lean as the gusts pass
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const TUFT_GLYPHS = [G[','], G["'"], G['`'], G['.'], G[','], G["'"], G['·']];
function buildGround() {
  const P = PI_;
  // The ground is the habitat's background: black with hints of green, or the paper with hints of green.
  const bg = LIGHT ? PAPER : [0, 0, 0], gc = LIGHT ? GROUND_PAPER : P.ground;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    const x = c * cw / S, y = r * ch / S;
    const n = 0.6 * vnoise(x / 260, y / 230, 21) + 0.4 * vnoise(x / 90, y / 80, 22);
    const patch = smooth(0.42, 0.82, n);
    const k = clamp(patch * set.green * 1.15, 0, 2);
    groundR[i] = clamp(bg[0] + (gc[0] - bg[0]) * k, 0, 255);
    groundG[i] = clamp(bg[1] + (gc[1] - bg[1]) * k, 0, 255);
    groundB[i] = clamp(bg[2] + (gc[2] - bg[2]) * k, 0, 255);
    const dens = (0.09 + 0.22 * patch + 0.08 * vnoise(x / 40, y / 40, 23)) * set.grass;
    const h = hash3(c, r, 11);
    tuft[i] = h < dens ? TUFT_GLYPHS[Math.floor(hash3(c, r, 5) * TUFT_GLYPHS.length)] : 0;
    tuftK[i] = (0.45 + 0.55 * hash3(c, r, 7)) * (0.55 + 0.45 * patch);
    tuftM[i] = hash3(c, r, 17);   // where a lying blade sits in its cell: ¯ - _
  }
  groundDirty = false;
}

function drawGround() {
  if (groundDirty) buildGround();
  BR.set(groundR); BG.set(groundG); BB.set(groundB); HB.fill(0);
  GI.fill(0);
  const P = PI_, gr = P.grass, st = P.stirred;
  const grassAmt = Math.min(1.4, set.grass);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c; const t0 = tuft[i]; if (!t0) continue;
    const x = (c + 0.5) * cw, y = (r + 0.5) * ch;
    windAt(x, y, simT);
    const s = clamp((wind.m / Math.max(1, 26 * S * Math.max(0.3, set.breeze)) - 0.35) / 1.3, 0, 1);
    // In a gust the blades lie over along the wind and catch the light: a bright band rolling across. A lying
    // blade is a silk line, on its own row in the cell.
    let g = t0;
    if (s > 0.45 && hash3(c, r, 13) < 0.25 + 0.6 * s) g = lineGlyph(wind.x, wind.y, tuftM[i]);
    const kk = s * 0.85;
    lGlyph(i, g, gr[0] + (st[0] - gr[0]) * kk, gr[1] + (st[1] - gr[1]) * kk, gr[2] + (st[2] - gr[2]) * kk,
      tuftK[i] * (0.42 + 0.58 * s) * grassAmt);
  }
  drawMotes();
}

/** Gold motes where the pointer stirs the air (the habitat's accent for the pointer breeze): above 60 pt/s of
 *  stirred air, a few empty cells show a gold `·` at up to 0.35 alpha, re-rolling with the shimmer's clock. They fade
 *  as the stirred air dies away (1.6/s), well under a second after the pointer stops. */
function drawMotes() {
  let any = false;
  for (let k = 0; k < PFX.length; k++) if (PFX[k] * PFX[k] + PFY[k] * PFY[k] > 3600) { any = true; break; }
  if (!any) return;
  const g = LIGHT ? GOLD_PAPER : PI_.gold, tick = Math.floor(simT * 2.4);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c; if (GI[i]) continue;
    const gx = clamp((c + 0.5) * cw / PG, 0, pgc - 1.001), gy = clamp((r + 0.5) * ch / PG, 0, pgr - 1.001);
    const ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy, j = iy * pgc + ix;
    const px = (PFX[j] * (1 - fx) + PFX[j + 1] * fx) * (1 - fy) + (PFX[j + pgc] * (1 - fx) + PFX[j + pgc + 1] * fx) * fy;
    const py = (PFY[j] * (1 - fx) + PFY[j + 1] * fx) * (1 - fy) + (PFY[j + pgc] * (1 - fx) + PFY[j + pgc + 1] * fx) * fy;
    const m = Math.hypot(px, py); if (m < 60 * S) continue;
    const k = smooth(60 * S, 180 * S, m);
    if (hash3(c, r, tick + (hash3(c, r, 3) * 3 | 0)) > 0.12 + 0.2 * k) continue;
    glyphAt(i, G['·'], g[0], g[1], g[2], (0.2 + 0.15 * k) * set_accent());
  }
}

function buildGrid() {
  gridCtx.setTransform(1, 0, 0, 1, 0, 0);
  gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
  if (set.grid) {
    // One device pixel at each cell's top and left edge, row and column 0 too (white 5.5 % / ink 8 %).
    gridCtx.fillStyle = LIGHT ? 'rgba(35,35,35,0.08)' : 'rgba(255,255,255,0.055)';
    for (let c = 0; c < cols; c++) gridCtx.fillRect(Math.round(c * cw * DPR), 0, 1, gridCanvas.height);
    for (let r = 0; r < rows; r++) gridCtx.fillRect(0, Math.round(r * ch * DPR), gridCanvas.width, 1);
  }
  gridDirty = false;
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Frame
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

function render() {
  drawGround();
  for (const f of flowers) drawFlower(f);
  const order = flies.slice().sort((a, b) => a.z - b.z);
  for (const b of order) drawShadow(b);
  for (const b of order) drawButterfly(b);
  drawDust();
  blit();
}

function blit() {
  // Calm: dims toward black, or toward the paper in light.
  const bright = set.calm ? 0.62 : 1;
  const pr = LIGHT ? PAPER : [0, 0, 0];
  // 1. The ground (the habitat's background), seamless; under a block cell, the ground it stands on.
  const data = blockImage.data;
  for (let i = 0, j = 0; i < N; i++, j += 4) {
    let r, g, b;
    if (HB[i]) { r = groundR[i]; g = groundG[i]; b = groundB[i]; } else { r = BR[i]; g = BG[i]; b = BB[i]; }
    if (bright !== 1) { r = pr[0] + (r - pr[0]) * bright; g = pr[1] + (g - pr[1]) * bright; b = pr[2] + (b - pr[2]) * bright; }
    data[j] = r; data[j + 1] = g; data[j + 2] = b; data[j + 3] = 255;
  }
  blockCtx.putImageData(blockImage, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(blockCanvas, 0, 0, cols, rows, 0, 0, Math.round(cols * cw * DPR), Math.round(rows * ch * DPR));
  // 2. The grid.
  if (gridDirty) buildGrid();
  if (set.grid) ctx.drawImage(gridCanvas, 0, 0);
  // 3. Blocks, each inset one point from its cell's top-left grid lines (Shaders.swift canvas_main), so each sits
  //    in its own tile with a strip of ground and grid line showing: the family's mosaic.
  const ins = Math.round(DPR);
  let lastStyle = '';
  for (let r = 0; r < rows; r++) {
    const y0 = Math.round(r * ch * DPR) + ins, y1 = Math.round((r + 1) * ch * DPR);
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c; if (!HB[i]) continue;
      let br = BR[i], bg = BG[i], bb = BB[i];
      if (bright !== 1) { br = pr[0] + (br - pr[0]) * bright; bg = pr[1] + (bg - pr[1]) * bright; bb = pr[2] + (bb - pr[2]) * bright; }
      const style = 'rgb(' + (br | 0) + ',' + (bg | 0) + ',' + (bb | 0) + ')';
      if (style !== lastStyle) { ctx.fillStyle = style; lastStyle = style; }
      const x0 = Math.round(c * cw * DPR) + ins;
      ctx.fillRect(x0, y0, Math.round((c + 1) * cw * DPR) - x0, y1 - y0);
    }
  }
  // 4. Glyphs over everything.
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.font = '600 ' + Math.round(ch * 0.74) + 'px "Geist Mono", ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let lastA = -1; lastStyle = '';
  for (let r = 0; r < rows; r++) {
    const y = r * ch + ch / 2 + 1;
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, g = GI[i]; if (!g) continue;
      let a = IA[i]; if (a <= 0.02) continue;
      let ir = IR[i], ig = IG[i], ib = IB[i];
      if (bright !== 1) { ir = pr[0] + (ir - pr[0]) * bright; ig = pr[1] + (ig - pr[1]) * bright; ib = pr[2] + (ib - pr[2]) * bright; }
      const style = 'rgb(' + (ir | 0) + ',' + (ig | 0) + ',' + (ib | 0) + ')';
      if (style !== lastStyle) { ctx.fillStyle = style; lastStyle = style; }
      a = a > 1 ? 1 : a;
      if (a !== lastA) { ctx.globalAlpha = a; lastA = a; }
      ctx.fillText(GL[g], c * cw + cw / 2, y);
    }
  }
  ctx.globalAlpha = 1;
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Pointer: stir the breeze, flush the butterflies near a fast pointer, click to bloom
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const ptr = { x: 0, y: 0, t: 0, down: false, moved: 0, has: false };
canvas.addEventListener('pointermove', e => {
  const now = performance.now() / 1000;
  if (ptr.has) {
    const dt = Math.max(0.008, now - ptr.t);
    const vx = (e.clientX - ptr.x) / dt, vy = (e.clientY - ptr.y) / dt;
    const sp = Math.hypot(vx, vy);
    stir(e.clientX, e.clientY, clamp(vx, -1500, 1500), clamp(vy, -1500, 1500));
    ptr.moved += Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y);
    if (sp > 380) {
      for (const b of flies) {
        const d = Math.hypot(b.x - e.clientX, b.y - e.clientY);
        if (d < b.sp.flush * cw * (1 + sp / 1500)) {
          if (b.state === 'nectar' || b.state === 'bask') takeOff(b, e.clientX, e.clientY);
          else if (b.boost <= 0) { b.boost = 0.7; const a = Math.atan2(b.y - e.clientY, b.x - e.clientX); b.jink += angDiff(b.heading, a) * 0.8; }
        }
      }
    }
  }
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = now; ptr.has = true;
});
canvas.addEventListener('pointerdown', e => { ptr.down = true; ptr.moved = 0; });
canvas.addEventListener('pointerup', e => { if (ptr.down && ptr.moved < 6) bloomAt(e.clientX, e.clientY); ptr.down = false; });
canvas.addEventListener('pointerleave', () => { ptr.has = false; });

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  The panel
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
const controlsEl = document.getElementById('controls');
const refresh = {};
function setPanel(open) {
  panel.classList.toggle('hidden', !open);
  toggle.textContent = open ? 'Hide tweaks' : 'Tweaks';
  toggle.setAttribute('aria-expanded', String(open));
}
toggle.addEventListener('click', () => setPanel(panel.classList.contains('hidden')));

function onChange(k) {
  save();
  if (k === 'count' || k === 'species') syncFlies();
  if (k === 'density' || k === 'flowerSize') { clearTimeout(onChange.t); onChange.t = setTimeout(() => { plant(); for (const b of flies) if (b.flower && !flowerById(b.flower)) { b.flower = 0; if (b.state !== 'fly') { b.state = 'fly'; pickWaypoint(b); } } }, 120); }
  if (k === 'green' || k === 'grass') groundDirty = true;
  if (k === 'theme') setTheme();
  if (k === 'grid') gridDirty = true;
  if (k === 'leaves') for (const f of flowers) f.reach = Math.max(f.R * 1.15, ...f.leaves.map(l => l.len * Math.min(1, 0.4 + 0.6 * set.leaves))) + 2 * cw;
}

/** A reset beside a control: back to its default. Dimmed while the control is at its default. */
function addReset(row, label, defText, isDef, reset) {
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'rs'; btn.textContent = '↺';
  btn.title = 'Back to the default: ' + defText;
  btn.setAttribute('aria-label', 'Reset ' + label + ' to its default, ' + defText);
  btn.addEventListener('click', reset);
  row.querySelector('.top').appendChild(btn);
  return () => { btn.disabled = isDef(); };
}

function buildPanel() {
  controlsEl.innerHTML = '';
  for (const g of CONTROLS) {
    const sec = document.createElement('section'); sec.className = 'group';
    const h = document.createElement('h2'); h.textContent = g.group; sec.appendChild(h);
    for (const c of g.items) {
      const row = document.createElement('div'); row.className = 'row';
      if (c.type === 'species') {
        row.innerHTML = '<div class="top"><label>' + c.label + '</label></div>';
        const chips = document.createElement('div'); chips.className = 'chips';
        const ups = [];
        const rs = addReset(row, c.label, 'all four', () => SPECIES_LIST.every(s => set.species[s.key] === DEFAULTS.species[s.key]),
          () => { set.species = { ...DEFAULTS.species }; ups.forEach(u => u()); onChange('species'); });
        for (const s of SPECIES_LIST) {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
          b.innerHTML = '<i style="background:' + s.swatch + '"></i>' + s.label;
          const upd = () => b.classList.toggle('on', !!set.species[s.key]);
          b.addEventListener('click', () => { set.species[s.key] = !set.species[s.key]; ups.forEach(u => u()); onChange('species'); });
          ups.push(upd); chips.appendChild(b);
        }
        ups.push(rs); ups.forEach(u => u());
        refresh.species = ups;
        row.appendChild(chips);
      } else if (c.type === 'choice' || c.type === 'toggle') {
        row.innerHTML = '<div class="top"><label>' + c.label + '</label></div>';
        const chips = document.createElement('div'); chips.className = 'chips';
        const opts = c.type === 'toggle' ? [[true, 'On'], [false, 'Off']] : c.options;
        const ups = [];
        const defText = opts.find(o => o[0] === c.def)[1].toLowerCase();
        ups.push(addReset(row, c.label, defText, () => set[c.k] === c.def, () => { set[c.k] = c.def; ups.forEach(u => u()); onChange(c.k); }));
        for (const [v, lab] of opts) {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = lab;
          const upd = () => b.classList.toggle('on', set[c.k] === v);
          b.addEventListener('click', () => { set[c.k] = v; ups.forEach(u => u()); onChange(c.k); });
          ups.push(upd); chips.appendChild(b);
        }
        ups.forEach(u => u());
        refresh[c.k] = () => ups.forEach(u => u());
        row.appendChild(chips);
        if (c.hint) { const hn = document.createElement('div'); hn.className = 'hint'; hn.textContent = c.hint; row.appendChild(hn); }
      } else {
        const id = 'in-' + c.k;
        row.innerHTML = '<div class="top"><label for="' + id + '">' + c.label + '</label><output></output></div>' +
          '<input type="range" id="' + id + '" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '">' +
          '<div class="hint">' + c.hint + '</div>';
        const input = row.querySelector('input'), out = row.querySelector('output');
        let rs = null;
        const upd = () => {
          input.value = set[c.k]; out.textContent = c.fmt(set[c.k]);
          input.style.setProperty('--p', ((set[c.k] - c.min) / (c.max - c.min) * 100) + '%');
          if (rs) rs();
        };
        rs = addReset(row, c.label, c.fmt(c.def), () => Math.abs(set[c.k] - c.def) < c.step / 2, () => { set[c.k] = c.def; upd(); onChange(c.k); });
        input.addEventListener('input', () => { set[c.k] = +input.value; upd(); onChange(c.k); });
        refresh[c.k] = upd; upd();
      }
      sec.appendChild(row);
    }
    controlsEl.appendChild(sec);
  }
}
function refreshAll() { for (const k in refresh) { const r = refresh[k]; if (Array.isArray(r)) r.forEach(f => f()); else r(); } }

document.getElementById('reset').addEventListener('click', () => {
  set = JSON.parse(JSON.stringify(DEFAULTS)); save(); refreshAll(); setTheme(); syncFlies(); plant(); groundDirty = true; gridDirty = true;
});
document.getElementById('replant').addEventListener('click', () => { flowers = flowers.filter(() => false); for (const b of flies) { b.flower = 0; b.state = 'fly'; pickWaypoint(b); } plant(); });
let paused = false;
const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause'; });
document.getElementById('copy').addEventListener('click', async () => {
  const out = { sketch: 'meadow s1', ...set, species: { ...set.species } };
  const text = JSON.stringify(out, null, 2);
  const btn = document.getElementById('copy');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } ta.remove();
  }
  btn.textContent = ok ? 'Copied' : 'Copy failed';
  setTimeout(() => { btn.textContent = 'Copy settings'; }, 1400);
});
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'h' || e.key === 'H') setPanel(panel.classList.contains('hidden'));
  if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
});

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Start
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const statsEl = document.getElementById('stats');
let last = 0, acc = 0, frames = 0, msSum = 0, statT = 0;
function loop(now) {
  const real = last ? Math.min(0.1, (now - last) / 1000) : 1 / 60;
  last = now;
  if (!paused) {
    // Fixed 60 Hz steps at 1 ×; slow motion takes the same steps, shortened.
    acc += real * set.timeScale;
    const h = 1 / 60 * Math.min(1, set.timeScale);
    let n = 0;
    while (acc >= h && n < 8) { step(h); acc -= h; n++; }
    if (n === 8) acc = 0;
  }
  const t0 = performance.now();
  render();
  msSum += performance.now() - t0; frames++;
  if (now - statT > 1000) { statsEl.textContent = (msSum / frames).toFixed(1) + ' ms · ' + flies.length + ' · ' + flowers.length + ' fl'; frames = 0; msSum = 0; statT = now; }
  requestAnimationFrame(loop);
}

function start() {
  resize();
  setTheme();
  plant();
  syncFlies();
  buildPanel();
  setPanel(params.has('panel') ? params.get('panel') !== '0' : window.innerWidth > 900);
  // ?warm=S runs S seconds of meadow before the first frame (for screenshots); ?freeze=1 holds it there.
  if (params.get('debug') === '1') window.__meadow = { step, render, get flies() { return flies; }, get flowers() { return flowers; }, get set() { return set; }, get t() { return simT; } };
  // ?sheet=flowers or ?sheet=flies lays out every kind for a close look (a development aid).
  const sheet = params.get('sheet');
  if (sheet === 'flowers') {
    flies = []; flowers = [];
    KINDS.forEach((k, i) => { const f = makeFlower(k, W * (0.14 + 0.24 * (i % 4)), H * (i < 4 ? 0.28 : 0.72), true); f.R = KIND[k].r * S * set.flowerSize * 1.05; flowers.push(f); });
    paused = true; render(); document.body.dataset.ready = '1'; return;
  }
  if (sheet === 'flies') {
    flowers = []; flies = [];
    const kinds = ['monarch', 'morpho', 'swallowtail', 'white'], phases = [0, 1.2, 2.2, 3.4];
    kinds.forEach((k, j) => phases.forEach((ph, i) => {
      const b = makeFly(k); b.x = W * (0.13 + 0.25 * i); b.y = H * (0.13 + 0.245 * j); b.heading = -Math.PI / 2 + (j % 2 ? 0.5 : -0.3);
      b.phase = ph; b.stroke = b.sp.mid + b.sp.amp * Math.cos(ph); b.z = +(params.get('z') || 0.5); b.zs = b.z; flies.push(b);
    }));
    paused = true; render(); document.body.dataset.ready = '1'; return;
  }
  const warm = +(params.get('warm') || 0);
  for (let t = 0; t < warm; t += 1 / 60) step(1 / 60);
  if (params.get('freeze') === '1') { paused = true; pauseBtn.textContent = 'Play'; render(); document.body.dataset.ready = '1'; return; }
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { const oldW = W, oldH = H; resize(); if (Math.abs(W - oldW) > 80 || Math.abs(H - oldH) > 80) plant(); });

const fontReady = document.fonts && document.fonts.load ? document.fonts.load('600 14px "Geist Mono"') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(start, start);
})();
</script>
