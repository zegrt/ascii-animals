<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Meadow Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Panel tokens. The meadow itself is drawn on the canvas with the app's own colours. */
:root {
  --page: #f7f6f3;
  --panel: rgba(250, 249, 246, 0.9);
  --panel-edge: rgba(35, 35, 35, 0.12);
  --fg: #232323;
  --muted: #6c6f68;
  --faint: #9a9d96;
  --track: rgba(35, 35, 35, 0.16);
  --fill: #4f7a3e;
  --chip: rgba(35, 35, 35, 0.06);
  --chip-on: rgba(79, 122, 62, 0.16);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #000;
    --panel: rgba(12, 14, 12, 0.86);
    --panel-edge: rgba(255, 255, 255, 0.09);
    --fg: #e4e7e1;
    --muted: #8f968c;
    --faint: #5f665c;
    --track: rgba(255, 255, 255, 0.14);
    --fill: #9cc987;
    --chip: rgba(255, 255, 255, 0.05);
    --chip-on: rgba(156, 201, 135, 0.16);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #000;
  --panel: rgba(12, 14, 12, 0.86);
  --panel-edge: rgba(255, 255, 255, 0.09);
  --fg: #e4e7e1;
  --muted: #8f968c;
  --faint: #5f665c;
  --track: rgba(255, 255, 255, 0.14);
  --fill: #9cc987;
  --chip: rgba(255, 255, 255, 0.05);
  --chip-on: rgba(156, 201, 135, 0.16);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; }
body { font-family: "Geist Mono", ui-monospace, Menlo, monospace; color: var(--fg); -webkit-font-smoothing: antialiased; }
canvas#meadow { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: crosshair; }

#toggle {
  position: fixed; top: 14px; right: 14px; z-index: 3;
  font: 500 12px/1 "Geist Mono", monospace; letter-spacing: 0.02em;
  color: var(--fg); background: var(--panel); border: 1px solid var(--panel-edge);
  border-radius: 999px; padding: 9px 14px; cursor: pointer; box-shadow: var(--shadow);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
#toggle:hover { border-color: var(--faint); }
#panel {
  position: fixed; top: 56px; right: 14px; bottom: 14px; z-index: 2; width: 348px;
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px;
  box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: opacity .18s ease, transform .18s ease;
}
#panel.hidden { opacity: 0; transform: translateX(12px); pointer-events: none; }
#panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--panel-edge); }
#panel h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
#panel header p { margin: 0; font-size: 11px; line-height: 1.45; color: var(--muted); }
#controls { overflow-y: auto; padding: 4px 16px 8px; flex: 1; scrollbar-width: thin; }
.group h2 { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 16px 0 8px; }
.row { margin: 0 0 12px; }
.row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row label { font-size: 12px; font-weight: 500; flex: 1; }
.rs { flex: none; width: 22px; height: 20px; padding: 0; font: 500 12px/1 "Geist Mono", ui-monospace, monospace; color: var(--muted); background: transparent; border: 1px solid var(--panel-edge); border-radius: 6px; cursor: pointer; align-self: center; }
.rs:hover:not(:disabled) { color: var(--fg); border-color: var(--faint); }
.rs:focus-visible { outline: 2px solid var(--fill); outline-offset: 1px; }
.rs:disabled { opacity: 0.28; cursor: default; }
.row output { font-size: 11px; color: var(--fill); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .hint { font-size: 10.5px; line-height: 1.4; color: var(--faint); margin-top: 3px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 4px 0 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--fill) var(--p, 50%), var(--track) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--fill); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--fg); margin-top: -5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--fg); border: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font: 500 11px/1 "Geist Mono", monospace; color: var(--muted); background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 7px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; opacity: .35; }
.chip.on { color: var(--fg); background: var(--chip-on); border-color: var(--panel-edge); }
.chip.on i { opacity: 1; }
#panel footer { border-top: 1px solid var(--panel-edge); padding: 10px 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#panel footer button { font: 500 11px/1 "Geist Mono", monospace; color: var(--fg); background: var(--chip); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
#panel footer button:hover { border-color: var(--faint); }
#panel footer button.primary { background: var(--chip-on); }
#stats { margin-left: auto; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  #toggle { top: 10px; right: 10px; }
  #panel { top: auto; left: 16px; right: 16px; bottom: 16px; width: auto; max-height: 62vh; }
  #panel.hidden { transform: translateY(12px); }
}
</style>
</head>
<body>
<canvas id="meadow" aria-label="An ASCII meadow seen from above, with butterflies"></canvas>
<button id="toggle" type="button" aria-expanded="true" aria-controls="panel">Hide tweaks</button>
<aside id="panel" aria-label="Meadow settings">
  <header>
    <h1>Meadow sketch</h1>
    <p>Drag across the meadow to stir the breeze. Click open ground to bloom a flower; click a bloom to nod it, puff its pollen and flush its visitor. Values here are what we port to the app.</p>
  </header>
  <div id="controls"></div>
  <footer>
    <button type="button" id="copy" class="primary">Copy settings</button>
    <button type="button" id="reset" title="Every value back to its default">Reset all</button>
    <button type="button" id="replant">New meadow</button>
    <button type="button" id="pause">Pause</button>
    <span id="stats"></span>
  </footer>
</aside>
<script>
(() => {
'use strict';

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Basics
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const params = new URLSearchParams(location.search);

let seed = params.has('seed') ? (+params.get('seed') | 0) : ((Math.random() * 1e6) | 0);
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
let rnd = mulberry32(seed);
const R = (a, b) => a + (b - a) * rnd();
const RI = (a, b) => Math.floor(a + (b - a + 1) * rnd());
function gauss() { const a = Math.max(rnd(), 1e-12), b = rnd(); return Math.sqrt(-2 * Math.log(a)) * Math.cos(TAU * b); }

/** A stable hash of three integers to [0, 1). */
function hash3(x, y, z) {
  let h = (Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
/** Smooth value noise in [0, 1]. */
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let xf = x - xi, yf = y - yi; xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
  const a = hash3(xi, yi, s), b = hash3(xi + 1, yi, s), c = hash3(xi, yi + 1, s), d = hash3(xi + 1, yi + 1, s);
  return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
}
const n1 = (t, s) => vnoise(t, 0.5, s) * 2 - 1;

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Settings: every slider the director plays with. `def` is the default; the panel is built from this list.
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const SPECIES_LIST = [
  { key: 'monarch', label: 'Monarch', swatch: '#c8641e' },
  { key: 'morpho', label: 'Morpho', swatch: '#3a78d0' },
  { key: 'swallowtail', label: 'Swallowtail', swatch: '#d4b844' },
  { key: 'white', label: 'Cabbage white', swatch: '#dcdacb' },
];

const f2 = v => (+v).toFixed(2), x2 = v => (+v).toFixed(2) + ' ×', sec = v => (+v).toFixed(1) + ' s';
// Defaults: the director's settings of 2026-11-20 ("for now"): more travel and more vigour, then glide 0.1 (after
// round 3). Every ↺ goes back to them.
const CONTROLS = [
  { group: 'Butterflies', items: [
    { k: 'count', label: 'How many', min: 1, max: 12, step: 1, def: 7, fmt: v => String(v),
      hint: 'Butterflies on screen at once. New ones fly in from an edge; spare ones fly out through the nearest edge.' },
    { k: 'areaCount', type: 'toggle', label: 'Scale the count by screen area', def: false,
      hint: 'On: "How many" is for a 1440 × 900 laptop screen, and a bigger screen gets more in proportion.' },
    { k: 'sizeLow', label: 'Size down on the flowers', min: 0.2, max: 1.5, step: 0.01, def: 0.75, fmt: x2,
      hint: 'Drawn size at ground level, as a share of the species size (a monarch is 22 cells across at 1 ×).' },
    { k: 'sizeHigh', label: 'Size up close', min: 0.4, max: 2.5, step: 0.01, def: 1.4, fmt: x2,
      hint: 'Drawn size at the top of their flight, nearest you. The gap between the two is the depth.' },
    { k: 'species', type: 'species', label: 'Species' },
  ] },
  { group: 'Flight', items: [
    { k: 'wingbeat', label: 'Wingbeat speed', min: 0.1, max: 1, step: 0.01, def: 0.5,
      fmt: v => f2(v) + ' × real · monarch ' + beatHz('monarch', v).toFixed(1) + ' Hz',
      hint: 'Share of the real wingbeat (the app today: 0.28, capped at 3 Hz). Capped at 7.5 Hz, 4 frames a beat at 30 fps.' },
    { k: 'lurch', label: 'Lurch on the downstroke', min: 0, max: 3, step: 0.01, def: 2, fmt: x2,
      hint: 'The push forward each downstroke gives: the jerky, beat-by-beat pace of a real butterfly.' },
    { k: 'zigzag', label: 'Zig-zag', min: 0, max: 3, step: 0.01, def: 1.29, fmt: x2,
      hint: 'Jinks and side-slips at each wingbeat (the cabbage white most, the monarch least).' },
    { k: 'glide', label: 'Gliding', min: 0, max: 3, step: 0.01, def: 0.1, fmt: x2,
      hint: 'How often and how long they stop beating and sail with wings flat, sinking toward the flowers.' },
    { k: 'speed', label: 'Travel speed', min: 0.3, max: 3, step: 0.01, def: 2, fmt: x2,
      hint: 'How fast they cross the screen (1 × is the measured cruise at screen scale).' },
    { k: 'turning', label: 'Turning', min: 0.2, max: 2, step: 0.01, def: 1.23, fmt: x2,
      hint: 'How quickly they swing round to face where they fly.' },
    { k: 'bob', label: 'Bob', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'The rise on each downstroke, seen from above as a pulse in size and shadow.' },
    { k: 'height', label: 'Time spent high vs low', min: 0, max: 1, step: 0.01, def: 0.5,
      fmt: v => v < 0.34 ? f2(v) + ' · mostly low' : v > 0.66 ? f2(v) + ' · mostly high' : f2(v) + ' · both',
      hint: '0 keeps them down among the flowers, 1 up close to you.' },
    { k: 'ease', label: 'Soft take-off and landing', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'Nothing snaps: at take-off the wings blend from the landed pose into the beat (0.15 s at 1 ×) and the body turns on its spring; landing brakes over the last beats and eases the wings into the pose (0.35 s). 0 is round 2\'s snap.' },
  ] },
  { group: 'Visits and wants', items: [
    { k: 'visits', label: 'Flower visits', min: 0, max: 1, step: 0.01, def: 0.35, fmt: f2,
      hint: 'Chance they head for a flower when they arrive somewhere, rather than travel on. A hungry one is likelier, a full one less.' },
    { k: 'stay', label: 'How long they stay', min: 0, max: 1.5, step: 0.01, def: 0.25,
      fmt: v => x2(v) + ' · monarch ' + Math.round(10 * v) + '–' + Math.round(40 * v) + ' s',
      hint: 'Share of the real time spent on a flower or basking (monarch 10–40 s at 1 ×), × each one\'s boldness.' },
    { k: 'bask', label: 'Basking', min: 0, max: 1, step: 0.01, def: 0.2, fmt: f2,
      hint: 'Chance they settle on the ground with wings open flat instead of travelling on. A cold one is likelier.' },
    { k: 'hunger', label: 'Hunger', min: 0, max: 3, step: 0.01, def: 1, fmt: v => v < 0.005 ? 'off' : x2(v) + ' · ' + (v * 1).toFixed(1) + ' %/s',
      hint: 'Nectar runs down 1 %/s in flight and fills while nectaring. A hungry one turns aside for a flower it senses. 0: fixed chances, as round 2.' },
    { k: 'warmth', label: 'Warmth', min: 0, max: 3, step: 0.01, def: 1, fmt: v => v < 0.005 ? 'off' : x2(v),
      hint: 'After a minute in the air they cool; a cold one is likelier to bask, and basking warms it. 0: fixed chances.' },
    { k: 'sense', label: 'Flower sensing', min: 3, max: 30, step: 0.5, def: 12, fmt: v => (+v).toFixed(1) + ' wingspans',
      hint: 'They sense flowers only this far, and not behind them (cos ≥ −0.2): senses, not knows. Round 2 saw the whole screen (30).' },
    { k: 'touchGo', label: 'Touch-and-go', min: 0, max: 0.8, step: 0.01, def: 0.25, fmt: f2,
      hint: 'Chance a landing is broken off at the last moment: it rises, circles the bloom once and tries again, or picks another.' },
  ] },
  { group: 'Temperament and the air', items: [
    { k: 'boldness', label: 'Boldness spread', min: 0, max: 1, step: 0.01, def: 1, fmt: v => (1 - 0.4 * v).toFixed(2) + '–' + (1 + 0.4 * v).toFixed(2),
      hint: 'Each butterfly gets a boldness: a bold one sits through stronger air, stays a little longer and flies a little higher. 0: all alike.' },
    { k: 'airClose', label: 'Wings close in air of', min: 20, max: 200, step: 1, def: 60, fmt: v => Math.round(v) + ' pt/s',
      hint: 'A landed butterfly feels the moving air in its cell, gusts and your pointer alike: above this it leans downwind and starts closing its wings.' },
    { k: 'airFlush', label: 'Flushed by air of', min: 40, max: 400, step: 1, def: 120, fmt: v => Math.round(v) + ' pt/s',
      hint: 'Above this it takes off (× its boldness). Stir the air near one to flush it; a flying one veers off and beats harder.' },
    { k: 'relay', label: 'Alarm to neighbours', min: 0, max: 1, step: 0.01, def: 0.6, fmt: f2,
      hint: 'A flushed butterfly startles landed ones within 3 wingspans after 0.15–0.4 s, timid ones likelier. A small relay, never a whole-screen scatter.' },
    { k: 'spaceByHeight', type: 'toggle', label: 'Spacing only at similar heights', def: true,
      hint: 'On: they keep apart only from butterflies at about their height, so a high one may cross over a low one. Off: apart at any height (round 2).' },
  ] },
  { group: 'Your pointer', items: [
    { k: 'cursorLand', type: 'toggle', label: 'Land on a still pointer', def: true,
      hint: 'Hold the pointer still and one spirals in and settles on it, up at the glass, opening and closing now and then. Any move sends it off in an escape burst.' },
    { k: 'holdTime', label: 'Still for', min: 1, max: 10, step: 0.1, def: 3, fmt: sec,
      hint: 'How long the pointer has to stay still (within 2 pt) before one comes.' },
    { k: 'clickLimit', label: 'Clicked flowers kept', min: 1, max: 30, step: 1, def: 12, fmt: v => String(v),
      hint: 'Click open ground to bloom a flower (only where it has room). Beyond this many, the oldest one you planted closes and fades over 2 s, and any butterfly on it takes off.' },
    { k: 'answerGap', label: 'One answers a click every', min: 0, max: 20, step: 0.5, def: 5, fmt: sec,
      hint: 'A fresh bloom may call the nearest travelling butterfly (7 in 10), but only one at a time: none while one is still on its way to a bloom it was called to, and then not again for this long.' },
  ] },
  { group: 'Small life', items: [
    { k: 'life', label: 'Life when landed', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'Breathing, an antenna twitch now and then, a small shuffle on the flower, a lean in a gust. 0: still as round 2.' },
  ] },
  { group: 'Traces', items: [
    { k: 'downwash', label: 'Wing downwash', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'A low butterfly\'s downstrokes push the air out under it: the grass flickers and lies over beneath it, then settles.' },
    { k: 'nod', label: 'Flowers nod', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'A landing dips the flower along the butterfly\'s way; a take-off kicks it half as much back; a click on a bloom nods it away from your click.' },
  ] },
  { group: 'Flowers', items: [
    { k: 'density', label: 'Flower density', min: 0.2, max: 3, step: 0.01, def: 0.85, fmt: x2,
      hint: 'How many planted patches across the screen.' },
    { k: 'flowerSize', label: 'Flower size', min: 0.4, max: 2, step: 0.01, def: 1.32, fmt: x2,
      hint: 'Size of the blooms (a daisy is about 11 cells across at 1 ×).' },
    { k: 'leaves', label: 'Leaves', min: 0, max: 2, step: 0.01, def: 1.24, fmt: x2,
      hint: 'The dark rosettes of leaves under each bloom.' },
  ] },
  { group: 'Air and ground', items: [
    { k: 'breeze', label: 'Breeze', min: 0, max: 3, step: 0.01, def: 1.7, fmt: x2,
      hint: 'Gusts that ripple through the grass, sway the flowers and drift the butterflies.' },
    { k: 'shadow', label: 'Shadows', min: 0, max: 1.5, step: 0.01, def: 1, fmt: x2,
      hint: 'How dark the shadows are; a high butterfly casts a fainter, farther one.' },
    { k: 'green', label: 'Green in the ground', min: 0, max: 2.5, step: 0.01, def: 0.69, fmt: x2,
      hint: 'The hints of green in the black ground.' },
    { k: 'grass', label: 'Grass', min: 0, max: 2, step: 0.01, def: 1, fmt: x2,
      hint: 'How many grass marks, and how bright.' },
  ] },
  { group: 'Look', items: [
    { k: 'sparkle', label: 'Sparkle', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'The hide shimmer the sharks and spiders have: each cell re-rolls about 2.4 times a second, and a few take one of the family\'s seven accent colours or a white fleck. Flowers twinkle at half the rate. Accents are off on paper, as the spiders.' },
  ] },
  { group: 'View', items: [
    { k: 'timeScale', label: 'Slow motion', min: 0.05, max: 1.5, step: 0.01, def: 1,
      fmt: v => v >= 0.995 && v <= 1.005 ? '1 × (real time)' : x2(v),
      hint: 'Time scale for watching the wingbeat closely; 1 × is the speed the app runs.' },
    { k: 'theme', type: 'choice', label: 'Theme', options: [['dark', 'Dark'], ['light', 'Light']], def: 'dark' },
    { k: 'calm', type: 'toggle', label: 'Calm', def: false, hint: 'Dims everything, as the app\'s Calm does.' },
    { k: 'grid', type: 'toggle', label: 'Grid lines', def: true, hint: 'The faint cell grid the app draws.' },
  ] },
];

const DEFAULTS = { species: { monarch: true, morpho: true, swallowtail: true, white: true } };
for (const g of CONTROLS) for (const c of g.items) if (c.k !== 'species') DEFAULTS[c.k] = c.def;
// v4: round 4 changed a default (glide 0.1), so values saved by round 3 are not read back.
const STORE = 'meadow-sketch-settings-v4';
let set = JSON.parse(JSON.stringify(DEFAULTS));
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved && typeof saved === 'object') {
    for (const k in DEFAULTS) if (k in saved && typeof saved[k] === typeof DEFAULTS[k]) set[k] = saved[k];
  }
} catch (e) { /* storage blocked: defaults */ }
if (params.get('defaults') === '1') set = JSON.parse(JSON.stringify(DEFAULTS));
if (params.has('theme')) set.theme = params.get('theme') === 'light' ? 'light' : 'dark';
for (const [k, v] of params) if (k.startsWith('s.') && k.slice(2) in DEFAULTS) set[k.slice(2)] = typeof DEFAULTS[k.slice(2)] === 'boolean' ? v === '1' || v === 'true' : +v;
function save() { try { localStorage.setItem(STORE, JSON.stringify(set)); } catch (e) { /* ignore */ } }

/** Web's `Palette.tone` on paper: a level (0 … 255) runs from the ink to the paper (lit surfaces fade toward the
 *  paper, shade sinks toward the ink), and the colour's hue tints it at half strength. `lv` defaults to the
 *  colour's own brightness; `hs` the hue's strength (Web: 0.5). */
function toneP(r, g, b, lv, hs) {
  const l = Math.max(1, lum(r, g, b)), h = hs === undefined ? 0.5 : hs;
  const k = clamp((lv === undefined ? l : lv) / 255, 0, 1);

  OUT[1] = clamp((INK[1] + (PAPER[1] - INK[1]) * k) * (1 + (g / l - 1) * h), 0, PAPER[1]);
  OUT[2] = clamp((INK[2] + (PAPER[2] - INK[2]) * k) * (1 + (b / l - 1) * h), 0, PAPER[2]);

/** A colour at a family level (Web's dark `tone`: level × tint, the tint being the colour's hue). */
function atLevel(c, level) {

/** A body's block: wings, the body, a flower's disc. On paper, Web's tone. */

 *  Web's legs are near grey; our leaves and petals are strongly hued, and at a pale level a half-strength hue turns
 *  loud (mint leaves), so the pale block carries its hue at 0.3. */
function sBlock(i, r, g, b, a, hs) {

function sGlyph(i, gi, r, g, b, a) {

// ── The hide shimmer: Ocean's staggered re-roll clock, the family's seven accents ──
const ACCENTS = [rgb(224, 137, 44), rgb(224, 58, 50), rgb(180, 74, 224), rgb(51, 200, 204), rgb(60, 181, 74), rgb(49, 80, 232), rgb(217, 193, 74)];

/** For a cell's key: 1 an accent, 2 a fleck, 0 neither. Each cell re-rolls 2.4 times a second, on its own phase
 *  (Ocean: tick = floor(t × 2.4 + (K mod 997) / 97)). Accents below `acc`, flecks below `fleck` (cumulative), both
 *  × the Sparkle slider (Calm × 0.35). On paper there are no accents (Web's light accent list is empty), so the
 *  whole `fleck` share are flecks in the paper colour, as Web does. */

const GL = [' ', ':', ';', 't', '%', 'S', 'X', '8', '#', '@', '.', "'", ',', '`', 'o', '-', '*', '·', '¯', '_', '/', '\\', '|', '+', 'x', 'O', '°', 'v', '0'];

/** Web's line glyph (WebPainter `lineGlyph`) for a direction on screen (pt, y down) and where in its cell the line
 *  runs (`m`, 0 top … 1 bottom): a level line is ¯ near the top, _ near the bottom, - between; | beyond 1.12 rad;
 *  / or \ otherwise. */
function lineGlyph(dx, dy, m) {
  let phi = Math.atan2(dy, dx);
  if (phi > Math.PI / 2) phi -= Math.PI; else if (phi <= -Math.PI / 2) phi += Math.PI;
  const a = Math.abs(phi);

  const yAt = Math.abs(dx) > 0.2 * Math.abs(dy) ? ly + (px - lx) * dy / dx : ly;
  return clamp(0.5 + (yAt - py) / ch, 0, 1);

let groundR, groundG, groundB, tuft, tuftK, tuftM; // the ground, cached

// Cell writes. Blocks blend by `a` and mark the cell as a block; glyphs replace. INK_K < 1 while a fading flower
// draws: its blocks blend in by that much and its glyphs are that faint.
let INK_K = 1;
function blockAt(i, r, g, b, a) {

  else if (a > 0) { BR[i] += (r - BR[i]) * a; BG[i] += (g - BG[i]) * a; BB[i] += (b - BB[i]) * a; HB[i] = 1; }

/** A shadow: darker block, fainter glyph. */
function shade(i, k) {

  if (LIGHT) { const m = 1 - 0.32 * k; BR[i] *= m; BG[i] *= m; BB[i] *= m; IA[i] *= 1 - 0.5 * k; }
  else { const m = 1 - k; BR[i] *= m; BG[i] *= m; BB[i] *= m; IA[i] *= 1 - 0.9 * k; }

// wind.x/y: all the air (what grass, flowers, pollen and flight drift feel); ax/ay: the air a landed butterfly feels

const wind = { cx: 1, cy: 0, base: 0, x: 0, y: 0, g: 0, m: 0, ax: 0, ay: 0, px: 0, py: 0 };

function pfInit() { PG = 48 * S; pgc = Math.ceil(W / PG) + 1; pgr = Math.ceil(H / PG) + 1; PFX = new Float32Array(pgc * pgr); PFY = new Float32Array(pgc * pgr); DWX = new Float32Array(pgc * pgr); DWY = new Float32Array(pgc * pgr); }
function updateWind(t, dt) {
  const dir = 0.35 + 1.1 * n1(t * 0.013, 91);
  wind.cx = Math.cos(dir); wind.cy = Math.sin(dir);
  wind.base = 26 * S * set.breeze * (0.75 + 0.35 * n1(t * 0.05, 17));
  const k = Math.exp(-1.6 * dt);
  for (let i = 0; i < PFX.length; i++) { PFX[i] *= k; PFY[i] *= k; DWX[i] *= k; DWY[i] *= k; }
}
/** Gust strength at a point, 0 … 1: bands that roll downwind across the meadow. */
function gustAt(x, y, t) {
  const a = (x * wind.cx + y * wind.cy) / (300 * S) - t * 0.42;
  const b = (-x * wind.cy + y * wind.cx) / (520 * S);

/** The wind at a point into `wind.x/y` (pt/s), its gust (`g`) and speed (`m`). */
function windAt(x, y, t) {
  const g = gustAt(x, y, t);
  const m = wind.base * (0.2 + 1.7 * g);
  let px = 0, py = 0, dx = 0, dy = 0;
  const gx = clamp(x / PG, 0, pgc - 1.001), gy = clamp(y / PG, 0, pgr - 1.001);
  const ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy, i = iy * pgc + ix;
  if (PFX.length) {
    const a = (1 - fx) * (1 - fy), b = fx * (1 - fy), c = (1 - fx) * fy, d = fx * fy;
    px = PFX[i] * a + PFX[i + 1] * b + PFX[i + pgc] * c + PFX[i + pgc + 1] * d;
    py = PFY[i] * a + PFY[i + 1] * b + PFY[i + pgc] * c + PFY[i + pgc + 1] * d;
    dx = DWX[i] * a + DWX[i + 1] * b + DWX[i + pgc] * c + DWX[i + pgc + 1] * d;
    dy = DWY[i] * a + DWY[i + 1] * b + DWY[i + pgc] * c + DWY[i + pgc + 1] * d;

function stir(x, y, vx, vy) {
  const rad = 3, cx = x / PG, cy = y / PG;
  for (let r = Math.floor(cy - rad); r <= Math.ceil(cy + rad); r++) for (let c = Math.floor(cx - rad); c <= Math.ceil(cx + rad); c++) {
    if (c < 0 || r < 0 || c >= pgc || r >= pgr) continue;
    const d = Math.hypot(c - cx, r - cy) / rad; if (d >= 1) continue;

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Flowers seen from above, planted in patches
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const KINDS = ['daisy', 'coneflower', 'milkweed', 'fennel', 'clover', 'mustard', 'dandelion'];
const KIND = {
  daisy:      { r: 66, n: [2, 4],  weight: 1.4, f0: [1.5, 2.2], petals: [10, 13] },
  coneflower: { r: 72, n: [1, 3],  weight: 1.2,   f0: [0.7, 1.1], petals: [10, 12] },
  milkweed:   { r: 52, n: [1, 3],  weight: 0.9, f0: [0.8, 1.2], petals: [0, 0] },
  fennel:     { r: 80, n: [1, 2],  weight: 0.8, f0: [0.7, 1.0], petals: [6, 9] },
  clover:     { r: 38, n: [3, 5],  weight: 0.5,   f0: [1.8, 2.5], petals: [0, 0] },
  mustard:    { r: 52, n: [1, 3],  weight: 0.5, f0: [1.2, 1.8], petals: [0, 0] },
  dandelion:  { r: 50, n: [2, 4],  weight: 1,   f0: [1.6, 2.4], petals: [30, 36] },
};
let flowers = [];
let flowerId = 1;

function makeFlower(kind, x, y, grown) {
  const K = KIND[kind];
  const R0 = K.r * S * set.flowerSize * R(0.82, 1.18);
  const f = { id: flowerId++, kind, x, y, R: R0, rot: R(0, TAU), seed: RI(1, 1e6), age: grown ? 1 : 0,
    n: RI(K.petals[0], K.petals[1]), f0: R(K.f0[0], K.f0[1]), ox: 0, oy: 0, vx: 0, vy: 0, busy: 0, leaves: [], clicked: !grown,
    dimT: 0, dimMax: 1 };
  // A rosette of leaves on the ground under the bloom (not swaying with it).
  const L = [];
  const add = (a, len, wid, kindL) => L.push({ a, len: len * R0, wid: wid * R0, k: kindL || 0 });
  const a0 = R(0, TAU);
  switch (kind) {
    case 'daisy': { const n = RI(4, 6); for (let i = 0; i < n; i++) add(a0 + i * TAU / n + R(-0.3, 0.3), R(1.3, 1.6), R(0.24, 0.3), 2); break; }
    case 'coneflower': { const n = RI(3, 4); for (let i = 0; i < n; i++) add(a0 + i * TAU / n + R(-0.3, 0.3), R(1.5, 1.85), R(0.26, 0.32)); break; }
    case 'milkweed': { add(a0, R(1.7, 2.0), 0.5); add(a0 + Math.PI, R(1.6, 1.9), 0.48); if (rnd() < 0.6) { add(a0 + Math.PI / 2, 1.4, 0.42); add(a0 - Math.PI / 2, 1.35, 0.42); } break; }
    case 'fennel': { const n = RI(7, 10); for (let i = 0; i < n; i++) add(a0 + i * TAU / n + R(-0.2, 0.2), R(1.1, 1.45), 0.06, 1); break; }
    case 'clover': { const n = RI(1, 2); for (let i = 0; i < n; i++) add(a0 + i * 2.6 + R(-0.3, 0.3), R(1.5, 1.8), 0.9, 3); break; }
    case 'mustard': { const n = RI(3, 4); for (let i = 0; i < n; i++) add(a0 + i * TAU / n + R(-0.3, 0.3), R(1.4, 1.7), R(0.3, 0.36), 2); break; }
    case 'dandelion': { const n = RI(6, 8); for (let i = 0; i < n; i++) add(a0 + i * TAU / n + R(-0.2, 0.2), R(1.5, 1.9), R(0.2, 0.24), 4); break; }
  }
  f.leaves = L;
  f.reach = Math.max(R0 * 1.15, ...L.map(l => l.len)) + 2 * cw;
  // Mustard: small four-petalled flowers in a loose spiral raceme. Milkweed/clover florets on a jittered grid.
  if (kind === 'mustard') {
    f.sub = []; const m = RI(6, 9);
    for (let i = 0; i < m; i++) { const r = R0 * (0.18 + 0.78 * Math.sqrt((i + 0.5) / m)), a = i * 2.39996 + f.rot;
      f.sub.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, s: R0 * R(0.26, 0.34) * (1 - 0.25 * (i / m)), open: i > 0, rot: R(0, TAU) }); }
  }
  return f;
}

function pickKind(x, y) {
  let tot = 0; for (const k of KINDS) tot += KIND[k].weight;
  let u = rnd() * tot; for (const k of KINDS) { u -= KIND[k].weight; if (u <= 0) return k; } return 'daisy';
}

function plant() {
  const keep = flowers.filter(f => f.clicked);
  flowers = keep;
  const area = W * H;
  const patches = Math.max(1, Math.round(area / (190000 * S * S) * set.density));
  const centres = [];
  const margin = 20 * S;
  for (let p = 0; p < patches; p++) {
    // Spread patches over the whole screen: the best of a few candidates for distance from the others.
    let best = null, bestD = -1;
    for (let i = 0; i < 10; i++) {
      const x = R(margin, W - margin), y = R(margin, H - margin);
      let d = 1e9; for (const c of centres) d = Math.min(d, Math.hypot(c.x - x, c.y - y));
      if (d > bestD) { bestD = d; best = { x, y }; }
    }
    centres.push(best);
    const kind = pickKind(best.x, best.y), K = KIND[kind];
    const n = RI(K.n[0], K.n[1]);
    const spread = K.r * S * set.flowerSize * (1.6 + 0.5 * n);
    for (let i = 0; i < n; i++) {
      for (let t = 0; t < 14; t++) {
        const a = R(0, TAU), r = spread * Math.sqrt(rnd());
        const x = best.x + Math.cos(a) * r, y = best.y + Math.sin(a) * r;
        if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
        const cand = makeFlower(kind, x, y, true);
        let ok = true;
        for (const o of flowers) if (Math.hypot(o.x - x, o.y - y) < (o.R + cand.R) * 1.05) { ok = false; break; }
        if (ok) { flowers.push(cand); break; }
      }
    }
  }
  // Small ones first so the big blooms lie over them.
  flowers.sort((a, b) => a.R - b.R);
}

// ── Your clicks ──
// A click on a bloom touches it; a click on open ground blooms a flower where one has room; the flowers you plant are
// limited (the oldest fades); and only one butterfly at a time answers a fresh bloom.
const FADE_S = 2;      // how long a flower over the limit takes to close and fade, s
let answerAt = -1e9;   // simT when a butterfly last answered a click
const growOf = f => f.age >= 1 ? 1 : easeOutBack(f.age);

function clickAt(x, y) {
  // On or near a bloom (within about its drawn radius, from the head as it sways): touch that one, the nearest.
  let hit = null, hd = 1e9;
  for (const f of flowers) {
    if (f.fading) continue;
    const d = Math.hypot(f.x + f.ox - x, f.y + f.oy - y), rr = Math.max(f.R * growOf(f), 0.35 * f.R) + 0.5 * cw;
    if (d < rr && d / rr < hd) { hd = d / rr; hit = f; }
  }
  if (hit) { touchFlower(hit, x, y); return; }
  // Open ground: a new bloom only if it would not overlap another (the planting rule); otherwise the click touches
  // the bloom in the way, the nearest edge first.
  const f = makeFlower(pickKind(x, y), x, y, false);
  let block = null, bd = 1e9;
  for (const o of flowers) {
    if (o.fading) continue;
    const gap = Math.hypot(o.x - x, o.y - y) - (o.R + f.R) * 1.05;
    if (gap < 0 && gap < bd) { bd = gap; block = o; }
  }
  if (block) { touchFlower(block, x, y); return; }
  flowers.push(f);
  for (let i = 0; i < 16; i++) {
    const a = R(0, TAU), v = R(20, 70) * S;
    dust.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(1.2, 2.2), max: 2.2, spark: true });
  }
  limitClicked();
  // A fresh bloom is an offer: the nearest travelling butterfly may come, but only one answers at a time.
  if (flies.some(b => b.called && b.state === 'approach')) return;
  if (simT - answerAt < set.answerGap) return;
  let best = null, bd2 = 1e9;
  for (const b of flies) if (b.state === 'fly' && !b.leaving && !b.entering && b.wait <= 0) { const d = Math.hypot(b.x - x, b.y - y); if (d < bd2) { bd2 = d; best = b; } }
  if (best && rnd() < 0.7) { goToFlower(best, f); best.timer = 16; best.called = true; answerAt = simT; }
}

/** A touch: the head nods away from the click on its spring, a small puff of pollen, and a butterfly sitting on it
 *  takes off away from the click. Repeated touches only repeat this (the spring's travel is capped). */
function touchFlower(f, x, y) {
  const hx = f.x + f.ox, hy = f.y + f.oy;
  let dx = hx - x, dy = hy - y, d = Math.hypot(dx, dy);
  if (d < 0.15 * f.R) { const a = R(0, TAU); dx = Math.cos(a); dy = Math.sin(a); } else { dx /= d; dy /= d; }
  // A poke peaks near 0.13 R (a landing: 0.1 R); one already swung far takes less, so fast clicks don't pin it.
  if (set.nod > 0) { const v = 0.25 * f.R * TAU * f.f0 * set.nod * clamp(1 - Math.hypot(f.ox, f.oy) / (0.45 * f.R), 0.2, 1); f.vx += dx * v; f.vy += dy * v; }
  // The puff: a few sparks of pollen from the head; fewer while it is being clicked fast.
  const n = simT - (f.touchT || -9) < 0.5 ? 3 : 8; f.touchT = simT;
  for (let i = 0; i < n; i++) {
    const a = R(0, TAU), v = R(15, 45) * S, r = R(0, 0.3) * f.R;
    dust.push({ x: hx + Math.cos(a) * r, y: hy + Math.sin(a) * r, vx: Math.cos(a) * v + dx * 20 * S, vy: Math.sin(a) * v + dy * 20 * S, life: R(0.7, 1.4), max: 1.4, spark: true });
  }
  for (const b of flies) if (b.flower === f.id && b.state === 'nectar') takeOff(b, x, y, true);
}

/** Beyond the limit, the oldest flower you planted closes and fades. */
function limitClicked() {
  const mine = flowers.filter(f => f.clicked && !f.fading).sort((a, b) => a.id - b.id);
  for (let i = 0; i < mine.length - set.clickLimit; i++) fadeFlower(mine[i]);
}
function fadeFlower(f) {
  f.fading = true; f.fade = 1;
  for (const b of flies) {
    if (b.flower !== f.id) continue;
    if (isLanded(b)) takeOff(b);
    else { releaseFlower(b); b.state = 'fly'; b.goal = ''; b.tag = 0; b.circleT = 0; b.called = false; pickWaypoint(b); }
  }
  f.busy = 0;
}

function stepFlowers(dt) {
  let gone = false;
  for (const f of flowers) {
    if (f.fading) { f.fade -= dt / FADE_S; if (f.fade <= 0) gone = true; }
    if (f.age < 1) f.age = Math.min(1, f.age + dt / 2.2);
    if (f.dimT > 0) f.dimT = Math.max(0, f.dimT - dt);
    // The head is a damped spring at the top of its stem, forced by drag in the wind (research §4.2).
    windAt(f.x, f.y, simT);
    const w = TAU * f.f0, zeta = 0.12;
    const k = 0.0035 * (1 + 0.6 * (f.R / (30 * S)));
    const fx = wind.x * wind.m * k, fy = wind.y * wind.m * k;
    f.vx += (fx - w * w * f.ox - 2 * zeta * w * f.vx) * dt;
    f.vy += (fy - w * w * f.oy - 2 * zeta * w * f.vy) * dt;
    f.ox += f.vx * dt; f.oy += f.vy * dt;
    const lim = 0.45 * f.R; const m = Math.hypot(f.ox, f.oy);
    if (m > lim) { f.ox *= lim / m; f.oy *= lim / m; }
  }
  if (gone) flowers = flowers.filter(f => !(f.fading && f.fade <= 0));
}
const flowerById = id => { for (const f of flowers) if (f.id === id) return f; return null; };

// ── drawing a flower ──

// `disc`: the part a visit dims; `lit`: a lit dome (a disc or cone), drawn on paper as a body rather than a stroke.
const FH = { hit: 0, r: 0, g: 0, b: 0, gi: 0, ir: 0, ig: 0, ib: 0, ia: 1, solid: true, disc: false, lit: false };
function fhit(layer, r, g, b, gi, ir, ig, ib, ia, solid) { FH.hit = layer; FH.r = r; FH.g = g; FH.b = b; FH.gi = gi; FH.ir = ir; FH.ig = ig; FH.ib = ib; FH.ia = ia; FH.solid = solid; FH.disc = false; FH.lit = false; }
/** A visited flower's disc shows it: for 20–40 s the disc dims × 0.85 and its glyphs drop a step, easing back. */
const visitDim = f => f.dimT > 0 ? smooth(0, 0.35, f.dimT / f.dimMax) : 0;
const DIM_STEP = { [G['o']]: G['°'], [G['°']]: G['·'], [G['·']]: G['.'], [G['*']]: G['x'], [G['x']]: G['+'], [G['+']]: G['·'] };
// The light comes from the top-left, a little above (also for the butterflies' wings and the shadows).
const LX = -0.42, LY = -0.58, LZ = 0.70;
const LIGHT2 = Math.atan2(LY, LX);

/** Samples a bloom's head at offset (dx, dy) from its centre. Sets FH; FH.hit 0 for a miss. */
function headSample(f, dx, dy, grow) {
  // Always drawn in the dark palette; drawFlower maps the result onto the paper in light.
  const LIGHT = false, PI_ = PLANT_DARK;
  FH.hit = 0;
  const Rr = f.R * grow;
  if (Rr <= 0.5) return;
  const r = Math.hypot(dx, dy);
  if (r > Rr * 1.12) return;
  const P = PI_;
  const th = Math.atan2(dy, dx);
  const lit = Math.cos(th - LIGHT2);   // +1 on the side facing the light
  const s = f.seed;
  switch (f.kind) {
    case 'daisy': case 'coneflower': case 'dandelion': {
      const daisy = f.kind === 'daisy', cone = f.kind === 'coneflower';
      const eye = Rr * (daisy ? 0.3 : cone ? 0.42 : 0.26);
      if (r < eye) {
        // The disc (or cone): a lit dome of florets.
        const t = r / eye;
        const dome = 0.78 + 0.32 * lit * t - 0.18 * t * t;
        const base = daisy ? P.daisyEye : cone ? P.coneEye : P.dandelionEye;
        const ink = daisy ? P.daisyEyeInk : cone ? P.coneEyeInk : P.dandelion;
        const h = hash3(Math.round(dx / cw * 2), Math.round(dy / ch * 2), s);
        const gi = cone ? (h < 0.5 ? G['*'] : h < 0.75 ? G['x'] : G['+']) : daisy ? (t < 0.35 ? G['o'] : h < 0.5 ? G['·'] : G['°']) : (h < 0.5 ? G['*'] : G['·']);
        fhit(3, base[0] * dome, base[1] * dome, base[2] * dome, gi, ink[0], ink[1], ink[2], 0.85, true);
        FH.disc = true; FH.lit = !cone;   // a daisy's or dandelion's lit disc; the coneflower's dark cone carries bright glyphs
        return;
      }
      // Ray petals round the disc, each its own length and shade; gaps between them show the ground. Each petal is
      // a dim block carrying a bright stroke that points along it, so a bloom reads as an ASCII starburst.
      const n = f.n, u = ((th - f.rot) / TAU * n % n + n) % n;
      const idx = Math.floor(u + 0.5) % n, frac = u - Math.round(u);
      const len = Rr * (0.84 + 0.18 * hash3(idx, 3, s)) * (cone ? 0.94 : 1);
      if (r > len) return;
      const t = clamp((r - eye) / (len - eye), 0, 1);
      // Lateral distance from the petal's midline, pt; a petal is widest two-thirds of the way out.
      const lat = Math.abs(frac) * TAU / n * r;
      const pw = (daisy ? 0.15 : cone ? 0.24 : 0.2) * Rr * Math.pow(Math.sin(Math.PI * clamp(0.2 + 0.8 * t, 0, 1)), 0.6) * (0.6 + 0.4 * t);
      const dense = f.kind === 'dandelion';
      if (lat > pw && !dense) return;
      const base = daisy ? P.daisy : cone ? P.cone : P.dandelion;
      const v = 0.88 + 0.2 * hash3(idx, 7, s);
      // Daisies brighten to the tip; a coneflower's petals droop away, so they darken toward it. The base of every
      // petal sits in the disc's shadow.
      let k = daisy ? (0.6 + 0.4 * t) : cone ? (0.95 - 0.35 * t) : (0.7 + 0.3 * t);
      k *= v * (1 + 0.18 * lit) * (0.75 + 0.25 * smooth(0, 0.3, t));
      const block = LIGHT ? 1 : (daisy ? 0.22 : cone ? 0.36 : 0.45);
      const pa = f.rot + Math.round(u) * TAU / n;
      let gi;
      // The stroke runs along the petal's midline, on the row where the midline crosses the cell (Web's silk glyphs).
      if (dense) gi = hash3(Math.round(dx / cw), Math.round(dy / ch), s + 3) < 0.35 ? G['*'] : lineGlyph(Math.cos(th), Math.sin(th), 0.5);
      else if (t > 0.86) gi = hash3(idx, 11, s) < 0.5 ? G["'"] : G['.'];
      else gi = lineGlyph(Math.cos(pa), Math.sin(pa), lineRow(0, 0, Math.cos(pa), Math.sin(pa), dx, dy));
      const ik = Math.min(1.15, 0.75 + 0.45 * k);
      fhit(2, base[0] * k * block, base[1] * k * block, base[2] * k * block, gi, Math.min(255, base[0] * ik), Math.min(255, base[1] * ik), Math.min(255, base[2] * ik), 0.92, true);
      return;
    }
    case 'milkweed': case 'clover': {
      // A ball of florets: a lit dome, each floret a bright mark on the darker cluster.
      const clover = f.kind === 'clover';
      if (r > Rr) return;
      const t = r / Rr;
      const nz = Math.sqrt(Math.max(0, 1 - t * t));
      const nx = dx / Rr, ny = dy / Rr;
      const lam = clamp(nx * LX + ny * LY + nz * LZ, 0, 1);
      const body = clover ? P.cloverBody : P.milkweedBody;
      const fl = clover ? P.clover : P.milkweed;
      // Florets on a jittered grid in the bloom's own frame.
      const cs = Math.cos(f.rot), sn = Math.sin(f.rot);
      const lx = dx * cs + dy * sn, ly = -dx * sn + dy * cs;
      const cell = Rr * (clover ? 0.42 : 0.34);
      const gx = lx / cell, gy = ly / cell;
      let best = 9;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        const cx = Math.floor(gx) + i, cy = Math.floor(gy) + j;
        const px = cx + 0.25 + 0.5 * hash3(cx, cy, s), py = cy + 0.25 + 0.5 * hash3(cx, cy, s + 1);
        best = Math.min(best, Math.hypot(gx - px, gy - py));
      }
      const onFloret = best < 0.36;
      const shadeK = 0.45 + 0.75 * lam;
      if (onFloret) {
        const tip = clover && t > 0.55 ? P.cloverTip : fl;
        const ink = clover ? P.cloverTip : P.milkweedInk;
        const gi = clover ? (t > 0.6 ? G["'"] : G['°']) : (best < 0.18 ? G['*'] : G['°']);
        const bk = 0.62;

/** Wants: a hungry one is likelier to visit, a cold one to bask (round 2's fixed chances when the drive is off). */

/** Where on the pointer it sits: the proboscis tip at the pointer, the body behind it along its heading. */
function cursorSpot(b) {

function target(b) {

/** The flower nods: an impulse to its head's spring along `(hx, hy)` that peaks near 0.12 R × size (× k). */
function nodFlower(f, hx, hy, b, k) {

function land(b) {

    const d = Math.hypot(o.x - src.x, o.y - src.y);

const SUB9 = [];
for (const a of [-1 / 3, 0, 1 / 3]) for (const b of [-1 / 3, 0, 1 / 3]) SUB9.push([a, b]);
const MARK_G = [G['#'], G['%'], G['@'], G['8'], G['#'], G['%'], G['X']];

function drawButterfly(b) {
  setPose(b, false);
  const sp = b.sp, ink = INKS[b.kind];
  const reach = Math.max(POSE.hs, POSE.hh * (sp.shape.tailY > -9 ? 1.5 : 1.1)) + cw;
  const c0 = Math.max(0, Math.floor((POSE.cx - reach) / cw)), c1 = Math.min(cols - 1, Math.floor((POSE.cx + reach) / cw));
  const r0 = Math.max(0, Math.floor((POSE.cy - reach) / ch)), r1 = Math.min(rows - 1, Math.floor((POSE.cy + reach) / ch));

  const white = b.kind === 'white';
  for (let k = 0; k < 3; k++) FHUE[k] = ramp[2][k] + (U[k] - ramp[2][k]) * under;
  buildVeins(b);

  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const x0 = c * cw, y0 = r * ch, px = x0 + 0.5 * cw, py = y0 + 0.5 * ch, i = r * cols + c;
    // The family's five samples: the centre first.
    let hp = wingTest(px, py);
    const centre = hp >= 0;
    let hX = WT.X, hY = WT.Y, hs = WT.side, hsx = WT.sx, hsy = WT.sy, hits = centre ? 1 : 0;
    for (let k = 1; k < 5; k++) {

      if (p >= 0) { hits++; if (hp < 0) { hp = p; hX = WT.X; hY = WT.Y; hs = WT.side; hsx = WT.sx; hsy = WT.sy; } }
    }
    if (!hits) continue;

    const d = EI.d;
    // Keyed by the place on the wing's surface (its full span, not the drawn width), so the glyphs ride with the wing.
    const key = keyOf(Math.round(hX * POSE.hs / (cw * 0.9)), Math.round(hY * hsy / (cw * 0.9)), b.id * 8 + hp + 3 * hs);
    const isField = region === FIELD || region === SEAM;
    if (!centre || cov < 0.6) {
      // An edge: no block, only a light glyph (: ; from half covered, else . ' , `) at (70 + 80 × coverage) × dim,
      // so the silhouette softens as a shark's flank does. 7 % of a field's edge cells flash an accent.
      const gi = cov >= 0.5 ? HEAVY[(key >>> 8) & 1] : LIGHT_EDGE[(key >>> 8) & 3];
      if (isField && shimmer(key, 0.07, 0) === 1) { const a = ACCENTS[key % 7]; glyphAt(i, gi, a[0], a[1], a[2], 1); }
      else edgeGlyph(i, gi, isField ? FHUE : marks[2], (70 + 80 * cov) * dim * (isField ? 1 : 0.6));
      continue;
    }
    wingStamp[i] = stamp;
    const lam = hs ? POSE.lamR : POSE.lamL, spec = hs ? POSE.specR : POSE.specL;
    // The shade, 0 … 1: the wing's tilt to the light, deeper at the root, a little darker toward the rim.
    const t = clamp(hX * 1.2 - 0.12, 0, 1);

        wBlock(i, f[0] * dim, f[1] * dim, f[2] * dim, 1);
        // A vein: a dark silk line over the field.

        if (vg) { const m = marks[0]; wGlyph(i, vg, m[0], m[1], m[2], 1); break; }

        const s = shimmer(key, 0.06, 0.10);

        break;
      }
      case RING: {

        break;
      }

function drawBody(b, ink, dim, stamp) {

  // Tail to head, so the head wins its cell.

    const x = POSE.cx + fx * a, y = POSE.cy + fy * a, i = cellOf(x, y); if (i < 0) continue;
    const t = (a - tail) / (head - tail);
    const cx = (i % cols + 0.5) * cw, cy = (Math.floor(i / cols) + 0.5) * ch;
    const g = t > 0.86 ? (eyes ? G['%'] : G['o']) : t > 0.58 ? G['8'] : t < 0.08 ? G['·'] : lineGlyph(fx, fy, lineRow(POSE.cx, POSE.cy, fx, fy, cx, cy));
    wBlock(i, bl[0] * dim, bl[1] * dim, bl[2] * dim, 1); wingStamp[i] = stamp;
    const key = keyOf(Math.round(a / (cw * 0.9)), 0, b.id * 8 + 7);
    const s = t <= 0.86 ? shimmer(key, 0.06, 0.10) : 0;
    if (s) shimmerGlyph(i, g, s, key, false); else wGlyph(i, g, bi[0] * dim, bi[1] * dim, bi[2] * dim, 0.95);

    const a = head - 0.04 * hh, x = POSE.cx + fx * a + rx * sg * 0.85 * cw, y = POSE.cy + fy * a + ry * sg * 0.85 * cw;
    const i = cellOf(x, y); if (i < 0 || i === headCell) continue;

      const dxL = fx * Math.cos(ang) + rx * Math.sin(ang) * sg, dyL = fy * Math.cos(ang) + ry * Math.sin(ang) * sg;
      const lx = POSE.cx + fx * at * hh, ly = POSE.cy + fy * at * hh;

        sGlyph(i, lineGlyph(dxL, dyL, lineRow(lx, ly, dxL, dyL, cx, cy)), Math.min(255, fe[0] * lv * 1.12 / fl), Math.min(255, fe[1] * lv * 1.12 / fl), Math.min(255, fe[2] * lv * 1.12 / fl), 1);

}

function drawShadow(b) {
  const k0 = set.shadow * (LIGHT ? 0.9 : 0.8) * (1 - 0.55 * b.z);
  if (k0 <= 0.01) return;
  setPose(b, true);
  const sp = b.sp;
  const reach = Math.max(POSE.hs, POSE.hh * 1.5) + cw;
  const c0 = Math.max(0, Math.floor((POSE.cx - reach) / cw)), c1 = Math.min(cols - 1, Math.floor((POSE.cx + reach) / cw));
  const r0 = Math.max(0, Math.floor((POSE.cy - reach) / ch)), r1 = Math.min(rows - 1, Math.floor((POSE.cy + reach) / ch));
  // Softer the higher it flies: the samples spread wider.
  const spread = 0.3 + 0.9 * b.z;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const px = (c + 0.5) * cw, py = (r + 0.5) * ch;
    let cov = 0;
    for (let k = 0; k < 9; k++) if (wingTest(px + SUB9[k][0] * cw * spread * 1.5, py + SUB9[k][1] * ch * spread * 1.5) >= 0) cov++;
    // The body's shadow too.
    const dx = px - POSE.cx, dy = py - POSE.cy, u = dx * POSE.fx + dy * POSE.fy, v = dx * POSE.rx + dy * POSE.ry;
    if (Math.abs(v) < 0.5 * cw && u < 0.4 * POSE.hh && u > -0.78 * POSE.hh) cov = Math.max(cov, 6);
    if (cov) shade(r * cols + c, k0 * cov / 9);
  }
}

function drawDust() {
  const g = LIGHT ? GOLD_PAPER : PI_.gold;
  for (const d of dust) {
    const c = Math.floor(d.x / cw), r = Math.floor(d.y / ch); if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
    const a = clamp(d.life / d.max, 0, 1);
    const twinkle = d.spark ? (hash3(c, r, Math.floor(simT * 6)) < 0.5 ? G['+'] : G['·']) : (a > 0.5 ? G['·'] : G['.']);
    glyphAt(r * cols + c, twinkle, g[0], g[1], g[2], (d.spark ? 1 : 0.8) * a * set_accent());
  }
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  The ground: mainly black, slow patches of green, grass marks that ripple and lean as the gusts pass
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const TUFT_GLYPHS = [G[','], G["'"], G['`'], G['.'], G[','], G["'"], G['·']];
function buildGround() {
  const P = PI_;
  // The ground is the habitat's background: black with hints of green, or the paper with hints of green.
  const bg = LIGHT ? PAPER : [0, 0, 0], gc = LIGHT ? GROUND_PAPER : P.ground;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    const x = c * cw / S, y = r * ch / S;
    const n = 0.6 * vnoise(x / 260, y / 230, 21) + 0.4 * vnoise(x / 90, y / 80, 22);
    const patch = smooth(0.42, 0.82, n);
    const k = clamp(patch * set.green * 1.15, 0, 2);
    groundR[i] = clamp(bg[0] + (gc[0] - bg[0]) * k, 0, 255);
    groundG[i] = clamp(bg[1] + (gc[1] - bg[1]) * k, 0, 255);
    groundB[i] = clamp(bg[2] + (gc[2] - bg[2]) * k, 0, 255);
    const dens = (0.09 + 0.22 * patch + 0.08 * vnoise(x / 40, y / 40, 23)) * set.grass;
    const h = hash3(c, r, 11);
    tuft[i] = h < dens ? TUFT_GLYPHS[Math.floor(hash3(c, r, 5) * TUFT_GLYPHS.length)] : 0;
    tuftK[i] = (0.45 + 0.55 * hash3(c, r, 7)) * (0.55 + 0.45 * patch);
    tuftM[i] = hash3(c, r, 17);   // where a lying blade sits in its cell: ¯ - _
  }
  groundDirty = false;
}

function drawGround() {
  if (groundDirty) buildGround();
  BR.set(groundR); BG.set(groundG); BB.set(groundB); HB.fill(0);
  GI.fill(0);
  const P = PI_, gr = P.grass, st = P.stirred;
  const grassAmt = Math.min(1.4, set.grass);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c; const t0 = tuft[i]; if (!t0) continue;
    const x = (c + 0.5) * cw, y = (r + 0.5) * ch;
    windAt(x, y, simT);
    const s = clamp((wind.m / Math.max(1, 26 * S * Math.max(0.3, set.breeze)) - 0.35) / 1.3, 0, 1);
    // In a gust the blades lie over along the wind and catch the light: a bright band rolling across. A lying
    // blade is a silk line, on its own row in the cell.
    let g = t0;
    if (s > 0.45 && hash3(c, r, 13) < 0.25 + 0.6 * s) g = lineGlyph(wind.x, wind.y, tuftM[i]);
    const kk = s * 0.85;
    lGlyph(i, g, gr[0] + (st[0] - gr[0]) * kk, gr[1] + (st[1] - gr[1]) * kk, gr[2] + (st[2] - gr[2]) * kk,
      tuftK[i] * (0.42 + 0.58 * s) * grassAmt);
  }
  drawMotes();
}

/** Gold motes where the pointer stirs the air (the habitat's accent for the pointer breeze): above 60 pt/s of
 *  stirred air, a few empty cells show a gold `·` at up to 0.35 alpha, re-rolling with the shimmer's clock. They fade
 *  as the stirred air dies away (1.6/s), well under a second after the pointer stops. */
function drawMotes() {
  let any = false;
  for (let k = 0; k < PFX.length; k++) if (PFX[k] * PFX[k] + PFY[k] * PFY[k] > 3600) { any = true; break; }
  if (!any) return;
  const g = LIGHT ? GOLD_PAPER : PI_.gold, tick = Math.floor(simT * 2.4);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c; if (GI[i]) continue;
    const gx = clamp((c + 0.5) * cw / PG, 0, pgc - 1.001), gy = clamp((r + 0.5) * ch / PG, 0, pgr - 1.001);
    const ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy, j = iy * pgc + ix;
    const px = (PFX[j] * (1 - fx) + PFX[j + 1] * fx) * (1 - fy) + (PFX[j + pgc] * (1 - fx) + PFX[j + pgc + 1] * fx) * fy;
    const py = (PFY[j] * (1 - fx) + PFY[j + 1] * fx) * (1 - fy) + (PFY[j + pgc] * (1 - fx) + PFY[j + pgc + 1] * fx) * fy;
    const m = Math.hypot(px, py); if (m < 60 * S) continue;
    const k = smooth(60 * S, 180 * S, m);
    if (hash3(c, r, tick + (hash3(c, r, 3) * 3 | 0)) > 0.12 + 0.2 * k) continue;
    glyphAt(i, G['·'], g[0], g[1], g[2], (0.2 + 0.15 * k) * set_accent());
  }
}

function buildGrid() {
  gridCtx.setTransform(1, 0, 0, 1, 0, 0);
  gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
  if (set.grid) {
    // One device pixel at each cell's top and left edge, row and column 0 too (white 5.5 % / ink 8 %).
    gridCtx.fillStyle = LIGHT ? 'rgba(35,35,35,0.08)' : 'rgba(255,255,255,0.055)';
    for (let c = 0; c < cols; c++) gridCtx.fillRect(Math.round(c * cw * DPR), 0, 1, gridCanvas.height);
    for (let r = 0; r < rows; r++) gridCtx.fillRect(0, Math.round(r * ch * DPR), gridCanvas.width, 1);
  }
  gridDirty = false;
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Frame
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

function render() {
  drawGround();
  for (const f of flowers) drawFlower(f);
  const order = flies.slice().sort((a, b) => a.z - b.z);
  for (const b of order) drawShadow(b);
  for (const b of order) drawButterfly(b);
  drawDust();
  blit();
}

function blit() {
  // Calm: dims toward black, or toward the paper in light.
  const bright = set.calm ? 0.62 : 1;
  const pr = LIGHT ? PAPER : [0, 0, 0];
  // 1. The ground (the habitat's background), seamless; under a block cell, the ground it stands on.
  const data = blockImage.data;
  for (let i = 0, j = 0; i < N; i++, j += 4) {
    let r, g, b;
    if (HB[i]) { r = groundR[i]; g = groundG[i]; b = groundB[i]; } else { r = BR[i]; g = BG[i]; b = BB[i]; }
    if (bright !== 1) { r = pr[0] + (r - pr[0]) * bright; g = pr[1] + (g - pr[1]) * bright; b = pr[2] + (b - pr[2]) * bright; }
    data[j] = r; data[j + 1] = g; data[j + 2] = b; data[j + 3] = 255;
  }
  blockCtx.putImageData(blockImage, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(blockCanvas, 0, 0, cols, rows, 0, 0, Math.round(cols * cw * DPR), Math.round(rows * ch * DPR));
  // 2. The grid.
  if (gridDirty) buildGrid();
  if (set.grid) ctx.drawImage(gridCanvas, 0, 0);
  // 3. Blocks, each inset one point from its cell's top-left grid lines (Shaders.swift canvas_main), so each sits
  //    in its own tile with a strip of ground and grid line showing: the family's mosaic.
  const ins = Math.round(DPR);
  let lastStyle = '';
  for (let r = 0; r < rows; r++) {
    const y0 = Math.round(r * ch * DPR) + ins, y1 = Math.round((r + 1) * ch * DPR);
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c; if (!HB[i]) continue;
      let br = BR[i], bg = BG[i], bb = BB[i];
      if (bright !== 1) { br = pr[0] + (br - pr[0]) * bright; bg = pr[1] + (bg - pr[1]) * bright; bb = pr[2] + (bb - pr[2]) * bright; }
      const style = 'rgb(' + (br | 0) + ',' + (bg | 0) + ',' + (bb | 0) + ')';
      if (style !== lastStyle) { ctx.fillStyle = style; lastStyle = style; }
      const x0 = Math.round(c * cw * DPR) + ins;
      ctx.fillRect(x0, y0, Math.round((c + 1) * cw * DPR) - x0, y1 - y0);
    }
  }
  // 4. Glyphs over everything.
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.font = '600 ' + Math.round(ch * 0.74) + 'px "Geist Mono", ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let lastA = -1; lastStyle = '';
  for (let r = 0; r < rows; r++) {
    const y = r * ch + ch / 2 + 1;
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, g = GI[i]; if (!g) continue;
      let a = IA[i]; if (a <= 0.02) continue;
      let ir = IR[i], ig = IG[i], ib = IB[i];
      if (bright !== 1) { ir = pr[0] + (ir - pr[0]) * bright; ig = pr[1] + (ig - pr[1]) * bright; ib = pr[2] + (ib - pr[2]) * bright; }
      const style = 'rgb(' + (ir | 0) + ',' + (ig | 0) + ',' + (ib | 0) + ')';
      if (style !== lastStyle) { ctx.fillStyle = style; lastStyle = style; }
      a = a > 1 ? 1 : a;
      if (a !== lastA) { ctx.globalAlpha = a; lastA = a; }
      ctx.fillText(GL[g], c * cw + cw / 2, y);
    }
  }
  ctx.globalAlpha = 1;
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Pointer: stir the breeze, flush the butterflies near a fast pointer, click to bloom or touch a bloom
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const ptr = { x: 0, y: 0, t: 0, down: false, moved: 0, has: false, ax: 0, ay: 0, still: 0 };
canvas.addEventListener('pointermove', e => {
  const now = performance.now() / 1000;
  if (ptr.has) {
    const dt = Math.max(0.008, now - ptr.t);
    const vx = (e.clientX - ptr.x) / dt, vy = (e.clientY - ptr.y) / dt;
    // The pointer only stirs the air; butterflies feel the stirred air (stepFly, stepLanded), they don't see the pointer.
    stir(e.clientX, e.clientY, clamp(vx, -1500, 1500), clamp(vy, -1500, 1500));
    ptr.moved += Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y);
  } else { ptr.ax = e.clientX; ptr.ay = e.clientY; ptr.still = 0; }
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = now; ptr.has = true;
  // Still means within 2.5 pt of where it came to rest.
  if (Math.hypot(e.clientX - ptr.ax, e.clientY - ptr.ay) > 2.5) { ptr.ax = e.clientX; ptr.ay = e.clientY; pointerMoved(e.clientX, e.clientY); }
});
canvas.addEventListener('pointerdown', e => { ptr.down = true; ptr.moved = 0; });
// A click is not holding still: it restarts the still timer and sends off one on (or coming to) the pointer.
canvas.addEventListener('pointerup', e => { if (ptr.down && ptr.moved < 6) { pointerMoved(e.clientX, e.clientY); clickAt(e.clientX, e.clientY); } ptr.down = false; });
canvas.addEventListener('pointerleave', () => { ptr.has = false; });

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  The panel
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
const controlsEl = document.getElementById('controls');
const refresh = {};
function setPanel(open) {
  panel.classList.toggle('hidden', !open);
  toggle.textContent = open ? 'Hide tweaks' : 'Tweaks';
  toggle.setAttribute('aria-expanded', String(open));
}
toggle.addEventListener('click', () => setPanel(panel.classList.contains('hidden')));

function onChange(k) {
  save();
  if (k === 'count' || k === 'species' || k === 'areaCount') syncFlies();
  if (k === 'clickLimit') limitClicked();
  if (k === 'density' || k === 'flowerSize') { clearTimeout(onChange.t); onChange.t = setTimeout(() => { plant(); for (const b of flies) if (b.flower && !flowerById(b.flower)) { b.flower = 0; if (b.state !== 'fly') { b.state = 'fly'; pickWaypoint(b); } } }, 120); }
  if (k === 'green' || k === 'grass') groundDirty = true;
  if (k === 'theme') setTheme();
  if (k === 'grid') gridDirty = true;
  if (k === 'leaves') for (const f of flowers) f.reach = Math.max(f.R * 1.15, ...f.leaves.map(l => l.len * Math.min(1, 0.4 + 0.6 * set.leaves))) + 2 * cw;
}

/** A reset beside a control: back to its default. Dimmed while the control is at its default. */
function addReset(row, label, defText, isDef, reset) {
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'rs'; btn.textContent = '↺';
  btn.title = 'Back to the default: ' + defText;
  btn.setAttribute('aria-label', 'Reset ' + label + ' to its default, ' + defText);
  btn.addEventListener('click', reset);
  row.querySelector('.top').appendChild(btn);
  return () => { btn.disabled = isDef(); };
}

function buildPanel() {
  controlsEl.innerHTML = '';
  for (const g of CONTROLS) {
    const sec = document.createElement('section'); sec.className = 'group';
    const h = document.createElement('h2'); h.textContent = g.group; sec.appendChild(h);
    for (const c of g.items) {
      const row = document.createElement('div'); row.className = 'row';
      if (c.type === 'species') {
        row.innerHTML = '<div class="top"><label>' + c.label + '</label></div>';
        const chips = document.createElement('div'); chips.className = 'chips';
        const ups = [];
        const rs = addReset(row, c.label, 'all four', () => SPECIES_LIST.every(s => set.species[s.key] === DEFAULTS.species[s.key]),
          () => { set.species = { ...DEFAULTS.species }; ups.forEach(u => u()); onChange('species'); });
        for (const s of SPECIES_LIST) {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
          b.innerHTML = '<i style="background:' + s.swatch + '"></i>' + s.label;
          const upd = () => b.classList.toggle('on', !!set.species[s.key]);
          b.addEventListener('click', () => { set.species[s.key] = !set.species[s.key]; ups.forEach(u => u()); onChange('species'); });
          ups.push(upd); chips.appendChild(b);
        }
        ups.push(rs); ups.forEach(u => u());
        refresh.species = ups;
        row.appendChild(chips);
      } else if (c.type === 'choice' || c.type === 'toggle') {
        row.innerHTML = '<div class="top"><label>' + c.label + '</label></div>';
        const chips = document.createElement('div'); chips.className = 'chips';
        const opts = c.type === 'toggle' ? [[true, 'On'], [false, 'Off']] : c.options;
        const ups = [];
        const defText = opts.find(o => o[0] === c.def)[1].toLowerCase();
        ups.push(addReset(row, c.label, defText, () => set[c.k] === c.def, () => { set[c.k] = c.def; ups.forEach(u => u()); onChange(c.k); }));
        for (const [v, lab] of opts) {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = lab;
          const upd = () => b.classList.toggle('on', set[c.k] === v);
          b.addEventListener('click', () => { set[c.k] = v; ups.forEach(u => u()); onChange(c.k); });
          ups.push(upd); chips.appendChild(b);
        }
        ups.forEach(u => u());
        refresh[c.k] = () => ups.forEach(u => u());
        row.appendChild(chips);
        if (c.hint) { const hn = document.createElement('div'); hn.className = 'hint'; hn.textContent = c.hint; row.appendChild(hn); }
      } else {
        const id = 'in-' + c.k;
        row.innerHTML = '<div class="top"><label for="' + id + '">' + c.label + '</label><output></output></div>' +
          '<input type="range" id="' + id + '" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '">' +
          '<div class="hint">' + c.hint + '</div>';
        const input = row.querySelector('input'), out = row.querySelector('output');
        let rs = null;
        const upd = () => {
          input.value = set[c.k]; out.textContent = c.fmt(set[c.k]);
          input.style.setProperty('--p', ((set[c.k] - c.min) / (c.max - c.min) * 100) + '%');
          if (rs) rs();
        };
        rs = addReset(row, c.label, c.fmt(c.def), () => Math.abs(set[c.k] - c.def) < c.step / 2, () => { set[c.k] = c.def; upd(); onChange(c.k); });
        input.addEventListener('input', () => { set[c.k] = +input.value; upd(); onChange(c.k); });
        refresh[c.k] = upd; upd();
      }
      sec.appendChild(row);
    }
    controlsEl.appendChild(sec);
  }
}
function refreshAll() { for (const k in refresh) { const r = refresh[k]; if (Array.isArray(r)) r.forEach(f => f()); else r(); } }

document.getElementById('reset').addEventListener('click', () => {
  set = JSON.parse(JSON.stringify(DEFAULTS)); save(); refreshAll(); setTheme(); syncFlies(); plant(); groundDirty = true; gridDirty = true;
});
document.getElementById('replant').addEventListener('click', () => { flowers = flowers.filter(() => false); for (const b of flies) { b.flower = 0; if (b.state !== 'cursor' && b.goal !== 'cursor') { if (isLanded(b)) takeOff(b); b.state = 'fly'; b.goal = ''; pickWaypoint(b); } } plant(); });
let paused = false;
const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause'; });
document.getElementById('copy').addEventListener('click', async () => {
  const out = { sketch: 'meadow s1', ...set, species: { ...set.species } };
  const text = JSON.stringify(out, null, 2);
  const btn = document.getElementById('copy');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } ta.remove();
  }
  btn.textContent = ok ? 'Copied' : 'Copy failed';
  setTimeout(() => { btn.textContent = 'Copy settings'; }, 1400);
});
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'h' || e.key === 'H') setPanel(panel.classList.contains('hidden'));
  if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
});

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Start
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const statsEl = document.getElementById('stats');
let last = 0, acc = 0, frames = 0, msSum = 0, statT = 0;
function loop(now) {
  const real = last ? Math.min(0.1, (now - last) / 1000) : 1 / 60;
  last = now;
  if (!paused) {
    // Fixed 60 Hz steps at 1 ×; slow motion takes the same steps, shortened.
    acc += real * set.timeScale;
    const h = 1 / 60 * Math.min(1, set.timeScale);
    let n = 0;
    while (acc >= h && n < 8) { step(h); acc -= h; n++; }
    if (n === 8) acc = 0;
  }
  const t0 = performance.now();
  render();
  msSum += performance.now() - t0; frames++;
  if (now - statT > 1000) { statsEl.textContent = (msSum / frames).toFixed(1) + ' ms · ' + flies.length + ' · ' + flowers.length + ' fl'; frames = 0; msSum = 0; statT = now; }
  requestAnimationFrame(loop);
}

function start() {
  resize();
  setTheme();
  plant();
  syncFlies(true);
  openingMoment();
  buildPanel();
  setPanel(params.has('panel') ? params.get('panel') !== '0' : window.innerWidth > 900);
  // ?warm=S runs S seconds of meadow before the first frame (for screenshots); ?freeze=1 holds it there.
  if (params.get('debug') === '1') window.__meadow = { step, render, clickAt, syncFlies, onChange, get flies() { return flies; }, get flowers() { return flowers; }, get set() { return set; }, get t() { return simT; }, get ptr() { return ptr; }, wind, windAt, get DWX() { return DWX; } };
  // ?sheet=flowers or ?sheet=flies lays out every kind for a close look (a development aid).
  const sheet = params.get('sheet');
  if (sheet === 'flowers') {
    flies = []; flowers = [];
    KINDS.forEach((k, i) => { const f = makeFlower(k, W * (0.14 + 0.24 * (i % 4)), H * (i < 4 ? 0.28 : 0.72), true); f.R = KIND[k].r * S * set.flowerSize * 1.05; flowers.push(f); });
    paused = true; render(); document.body.dataset.ready = '1'; return;
  }
  if (sheet === 'flies') {
    flowers = []; flies = [];
    const kinds = ['monarch', 'morpho', 'swallowtail', 'white'], phases = [0, 1.2, 2.2, 3.4];
    kinds.forEach((k, j) => phases.forEach((ph, i) => {
      const b = makeFly(k); b.x = W * (0.13 + 0.25 * i); b.y = H * (0.13 + 0.245 * j); b.heading = -Math.PI / 2 + (j % 2 ? 0.5 : -0.3);
      b.phase = ph; b.stroke = b.sp.mid + b.sp.amp * Math.cos(ph); b.z = +(params.get('z') || 0.5); b.zs = b.z; flies.push(b);
    }));
    paused = true; render(); document.body.dataset.ready = '1'; return;
  }
  const warm = +(params.get('warm') || 0);
  for (let t = 0; t < warm; t += 1 / 60) step(1 / 60);
  if (params.get('freeze') === '1') { paused = true; pauseBtn.textContent = 'Play'; render(); document.body.dataset.ready = '1'; return; }
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { const oldW = W, oldH = H; resize(); if (Math.abs(W - oldW) > 80 || Math.abs(H - oldH) > 80) plant(); if (set.areaCount) syncFlies(); });

const fontReady = document.fonts && document.fonts.load ? document.fonts.load('600 14px "Geist Mono"') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(start, start);
})();
</script>
</body>
</html>
