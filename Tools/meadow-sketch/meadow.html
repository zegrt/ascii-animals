<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Meadow Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Panel tokens. The meadow itself is drawn on the canvas with the app's own colours. */
:root {
  --page: #f7f6f3;
  --panel: rgba(250, 249, 246, 0.9);
  --panel-edge: rgba(35, 35, 35, 0.12);
  --fg: #232323;
  --muted: #6c6f68;
  --faint: #9a9d96;
  --track: rgba(35, 35, 35, 0.16);
  --fill: #4f7a3e;
  --chip: rgba(35, 35, 35, 0.06);
  --chip-on: rgba(79, 122, 62, 0.16);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #000;
    --panel: rgba(12, 14, 12, 0.86);
    --panel-edge: rgba(255, 255, 255, 0.09);
    --fg: #e4e7e1;
    --muted: #8f968c;
    --faint: #5f665c;
    --track: rgba(255, 255, 255, 0.14);
    --fill: #9cc987;
    --chip: rgba(255, 255, 255, 0.05);
    --chip-on: rgba(156, 201, 135, 0.16);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #000;
  --panel: rgba(12, 14, 12, 0.86);
  --panel-edge: rgba(255, 255, 255, 0.09);
  --fg: #e4e7e1;
  --muted: #8f968c;
  --faint: #5f665c;
  --track: rgba(255, 255, 255, 0.14);
  --fill: #9cc987;
  --chip: rgba(255, 255, 255, 0.05);
  --chip-on: rgba(156, 201, 135, 0.16);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; }
body { font-family: "Geist Mono", ui-monospace, Menlo, monospace; color: var(--fg); -webkit-font-smoothing: antialiased; }
canvas#meadow { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: crosshair; }

#toggle {
  position: fixed; top: 14px; right: 14px; z-index: 3;
  font: 500 12px/1 "Geist Mono", monospace; letter-spacing: 0.02em;
  color: var(--fg); background: var(--panel); border: 1px solid var(--panel-edge);
  border-radius: 999px; padding: 9px 14px; cursor: pointer; box-shadow: var(--shadow);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
#toggle:hover { border-color: var(--faint); }
#panel {
  position: fixed; top: 56px; right: 14px; bottom: 14px; z-index: 2; width: 348px;
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px;
  box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: opacity .18s ease, transform .18s ease;
}
#panel.hidden { opacity: 0; transform: translateX(12px); pointer-events: none; }
#panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--panel-edge); }
#panel h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
#panel header p { margin: 0; font-size: 11px; line-height: 1.45; color: var(--muted); }
#controls { overflow-y: auto; padding: 4px 16px 8px; flex: 1; scrollbar-width: thin; }
.group h2 { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 16px 0 8px; }
.row { margin: 0 0 12px; }
.row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row label { font-size: 12px; font-weight: 500; flex: 1; }
.rs { flex: none; width: 22px; height: 20px; padding: 0; font: 500 12px/1 "Geist Mono", ui-monospace, monospace; color: var(--muted); background: transparent; border: 1px solid var(--panel-edge); border-radius: 6px; cursor: pointer; align-self: center; }
.rs:hover:not(:disabled) { color: var(--fg); border-color: var(--faint); }
.rs:focus-visible { outline: 2px solid var(--fill); outline-offset: 1px; }
.rs:disabled { opacity: 0.28; cursor: default; }
.row output { font-size: 11px; color: var(--fill); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .hint { font-size: 10.5px; line-height: 1.4; color: var(--faint); margin-top: 3px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 4px 0 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--fill) var(--p, 50%), var(--track) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--fill); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--fg); margin-top: -5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--fg); border: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font: 500 11px/1 "Geist Mono", monospace; color: var(--muted); background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 7px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; opacity: .35; }
.chip.on { color: var(--fg); background: var(--chip-on); border-color: var(--panel-edge); }
.chip.on i { opacity: 1; }
#panel footer { border-top: 1px solid var(--panel-edge); padding: 10px 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#panel footer button { font: 500 11px/1 "Geist Mono", monospace; color: var(--fg); background: var(--chip); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
#panel footer button:hover { border-color: var(--faint); }
#panel footer button.primary { background: var(--chip-on); }
#stats { margin-left: auto; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  #toggle { top: 10px; right: 10px; }
  #panel { top: auto; left: 16px; right: 16px; bottom: 16px; width: auto; max-height: 62vh; }
  #panel.hidden { transform: translateY(12px); }
}
</style>
</head>
<body>
<canvas id="meadow" aria-label="An ASCII meadow seen from above, with butterflies"></canvas>
<button id="toggle" type="button" aria-expanded="true" aria-controls="panel">Hide tweaks</button>
<aside id="panel" aria-label="Meadow settings">
  <header>
    <h1>Meadow sketch</h1>
    <p>Drag across the meadow to stir the breeze. Click open ground to bloom a flower; click a bloom to nod it, puff its pollen and flush its visitor. Values here are what we port to the app.</p>
  </header>
  <div id="controls"></div>
  <footer>
    <button type="button" id="copy" class="primary">Copy settings</button>
    <button type="button" id="reset" title="Every value back to its default">Reset all</button>
    <button type="button" id="replant">New meadow</button>
    <button type="button" id="pause">Pause</button>
    <span id="stats"></span>
  </footer>
</aside>
<script>
(() => {
'use strict';

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Basics
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const params = new URLSearchParams(location.search);

// `?debug=1&fixture=<name>` runs a replay fixture (see "Replay fixture" below): seed 42 unless `?seed=` is given.
const FIXTURE = params.get('debug') === '1' && params.has('fixture') ? params.get('fixture') : '';
let seed = params.has('seed') ? (+params.get('seed') | 0) : FIXTURE ? 42 : ((Math.random() * 1e6) | 0);
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// Two streams from the one seed: the meadow's own (planting, flight, the opening) and the one your input draws on
// (clicks, the panel, resizing, pointer moves), so an edit or a click never shifts the meadow's draws: a seed with no
// input replays the same flight. `rnd` is whichever stream is drawing; `ui(fn)` runs fn on the input stream.
const simRnd = mulberry32(seed), uiRnd = mulberry32(seed ^ 0x5bd1e995);
let rnd = simRnd;
const ui = fn => function (...args) { const prev = rnd; rnd = uiRnd; try { return fn.apply(this, args); } finally { rnd = prev; } };
const R = (a, b) => a + (b - a) * rnd();
const RI = (a, b) => Math.floor(a + (b - a + 1) * rnd());
function gauss() { const a = Math.max(rnd(), 1e-12), b = rnd(); return Math.sqrt(-2 * Math.log(a)) * Math.cos(TAU * b); }
/** A seeded shuffle (Fisher–Yates), the same in every engine (a random sort comparator is not). */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/** A stable hash of three integers to [0, 1). */
function hash3(x, y, z) {
  let h = (Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
/** Smooth value noise in [0, 1]. */
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let xf = x - xi, yf = y - yi; xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
  const a = hash3(xi, yi, s), b = hash3(xi + 1, yi, s), c = hash3(xi, yi + 1, s), d = hash3(xi + 1, yi + 1, s);
  return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
}
const n1 = (t, s) => vnoise(t, 0.5, s) * 2 - 1;

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Settings: every slider the director plays with. `def` is the default; the panel is built from this list.
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const SPECIES_LIST = [
  { key: 'monarch', label: 'Monarch', swatch: '#c8641e' },
  { key: 'morpho', label: 'Morpho', swatch: '#3a78d0' },
  { key: 'swallowtail', label: 'Swallowtail', swatch: '#d4b844' },
  { key: 'white', label: 'Cabbage white', swatch: '#dcdacb' },
];

const f2 = v => (+v).toFixed(2), x2 = v => (+v).toFixed(2) + ' ×', sec = v => (+v).toFixed(1) + ' s';
/** A stay in seconds as the display shows it: whole seconds, with the 0.8 s floor every landing keeps. */
const stayS = s => s < 0.8 ? '0.8' : s < 1 ? s.toFixed(1) : String(Math.round(s));
// Defaults: the director's settings of 2026-11-20 ("for now"): more travel and more vigour, then glide 0.1 (after
// round 3). Every ↺ goes back to them.
const CONTROLS = [
  { group: 'Butterflies', items: [
    { k: 'count', label: 'How many', min: 1, max: 12, step: 1, def: 7, fmt: v => String(v),
      hint: 'Butterflies on screen at once. New ones fly in from an edge; spare ones fly out through the nearest edge.' },
    { k: 'areaCount', type: 'toggle', label: 'Scale the count by screen area', def: false,
      hint: 'On: "How many" is for a 1440 × 900 laptop screen, and a bigger screen gets more in proportion.' },
    { k: 'sizeLow', label: 'Size down on the flowers', min: 0.2, max: 1.5, step: 0.01, def: 0.75, fmt: x2,
      hint: 'Drawn size at ground level, as a share of the species size (a monarch is 22 cells across at 1 ×). Never above Size up close: raising it past that takes Size up along.' },
    { k: 'sizeHigh', label: 'Size up close', min: 0.4, max: 2.5, step: 0.01, def: 1.4, fmt: x2,
      hint: 'Drawn size at the top of their flight, nearest you. The gap between the two is the depth. Never below Size down: lowering it past that takes Size down along.' },
    { k: 'species', type: 'species', label: 'Species' },
  ] },
  { group: 'Flight', items: [
    { k: 'wingbeat', label: 'Wingbeat speed', min: 0.1, max: 1, step: 0.01, def: 0.5,
      fmt: v => f2(v) + ' × real · monarch ' + beatHz('monarch', v).toFixed(1) + ' Hz',
      hint: 'Share of the real wingbeat (the app today: 0.28, capped at 3 Hz). Capped at 7.5 Hz, 4 frames a beat at 30 fps.' },
    { k: 'lurch', label: 'Lurch on the downstroke', min: 0, max: 3, step: 0.01, def: 2, fmt: x2,
      hint: 'The push forward each downstroke gives: the jerky, beat-by-beat pace of a real butterfly.' },
    { k: 'zigzag', label: 'Zig-zag', min: 0, max: 3, step: 0.01, def: 1.29, fmt: x2,
      hint: 'Jinks and side-slips at each wingbeat (the cabbage white most, the monarch least).' },
    { k: 'glide', label: 'Gliding', min: 0, max: 3, step: 0.01, def: 0.1, fmt: x2,
      hint: 'How often and how long they stop beating and sail with wings flat, sinking toward the flowers.' },
    { k: 'speed', label: 'Travel speed', min: 0.3, max: 3, step: 0.01, def: 2, fmt: x2,
      hint: 'How fast they cross the screen (1 × is the measured cruise at screen scale).' },
    { k: 'turning', label: 'Turning', min: 0.2, max: 2, step: 0.01, def: 1.23, fmt: x2,
      hint: 'How quickly they swing round to face where they fly.' },
    { k: 'bob', label: 'Bob', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'The rise on each downstroke, seen from above as a pulse in size and shadow.' },
    { k: 'height', label: 'Time spent high vs low', min: 0, max: 1, step: 0.01, def: 0.5,
      fmt: v => v < 0.34 ? f2(v) + ' · mostly low' : v > 0.66 ? f2(v) + ' · mostly high' : f2(v) + ' · both',
      hint: '0 keeps them down among the flowers, 1 up close to you.' },
    { k: 'ease', label: 'Soft take-off and landing', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'Nothing snaps: at take-off the wings blend from the landed pose into the beat (0.15 s at 1 ×) and the body turns on its spring; landing brakes over the last beats and eases the wings into the pose (0.35 s). 0 is round 2\'s snap.' },
  ] },
  { group: 'Visits and wants', items: [
    { k: 'visits', label: 'Flower visits', min: 0, max: 1, step: 0.01, def: 0.35, fmt: f2,
      hint: 'Chance they head for a flower when they arrive somewhere, rather than travel on. A hungry one is likelier, a full one less. The opening scene is set whatever this is: one on a flower, one basking, one coming in to land.' },
    { k: 'stay', label: 'How long they stay', min: 0, max: 1.5, step: 0.01, def: 0.25,
      fmt: v => x2(v) + ' · monarch ' + stayS(10 * v) + '–' + stayS(40 * v) + ' s',
      hint: 'Share of the real time spent on a flower or basking (monarch 10–40 s at 1 ×), × each one\'s boldness. Never under 0.8 s a stay.' },
    { k: 'bask', label: 'Basking', min: 0, max: 1, step: 0.01, def: 0.2, fmt: f2,
      hint: 'Chance they settle on the ground with wings open flat instead of travelling on. A cold one is likelier. The opening scene has one basking whatever this is.' },
    { k: 'hunger', label: 'Hunger', min: 0, max: 3, step: 0.01, def: 1, fmt: v => v < 0.005 ? 'off' : x2(v) + ' · ' + (v * 1).toFixed(1) + ' %/s',
      hint: 'Nectar runs down 1 %/s in flight and fills while nectaring. A hungry one turns aside for a flower it senses. 0: fixed chances, as round 2.' },
    { k: 'warmth', label: 'Warmth', min: 0, max: 3, step: 0.01, def: 1, fmt: v => v < 0.005 ? 'off' : x2(v),
      hint: 'After a minute in the air they cool; a cold one is likelier to bask, and basking warms it. 0: fixed chances.' },
    { k: 'sense', label: 'Flower sensing', min: 3, max: 30, step: 0.5, def: 12, fmt: v => (+v).toFixed(1) + ' wingspans',
      hint: 'They sense flowers only this far, and not behind them (cos ≥ −0.2): senses, not knows. Round 2 saw the whole screen (30).' },
    { k: 'touchGo', label: 'Touch-and-go', min: 0, max: 0.8, step: 0.01, def: 0.25, fmt: f2,
      hint: 'Chance a landing is broken off at the last moment: it rises, circles the bloom once and tries again, or picks another.' },
  ] },
  { group: 'Temperament and the air', items: [
    { k: 'boldness', label: 'Boldness spread', min: 0, max: 1, step: 0.01, def: 1, fmt: v => (1 - 0.4 * v).toFixed(2) + '–' + (1 + 0.4 * v).toFixed(2),
      hint: 'Each butterfly gets a boldness: a bold one sits through stronger air, stays a little longer and flies a little higher. 0: all alike.' },
    { k: 'airClose', label: 'Wings close in air of', min: 20, max: 200, step: 1, def: 60, fmt: v => Math.round(v) + ' pt/s',
      hint: 'A landed butterfly feels the moving air in its cell, gusts and your pointer alike. Its wings start closing at 0.6 × this and are closed by this or by 0.9 × the flush air, whichever is more; it leans downwind from 0.5 × this. Both × 0.7 + 0.3 × its boldness.' },
    { k: 'airFlush', label: 'Flushed by air of', min: 40, max: 400, step: 1, def: 120, fmt: v => Math.round(v) + ' pt/s',
      hint: 'Above this it takes off (× 0.7 + 0.3 × its boldness), even if that is below the closing air. Stir the air near one to flush it; a flying one veers off and beats harder.' },
    { k: 'relay', label: 'Alarm to neighbours', min: 0, max: 1, step: 0.01, def: 0.6, fmt: f2,
      hint: 'A flushed butterfly startles landed ones within 3 wingspans after 0.15–0.4 s, timid ones likelier. A small relay, never a whole-screen scatter.' },
    { k: 'spaceByHeight', type: 'toggle', label: 'Spacing only at similar heights', def: true,
      hint: 'On: they keep apart fully from butterflies at about their height and less from those higher or lower (from about a third of the height range apart, the steer keeps 70 % and the push a quarter), so a high one may cross over a low one. Off: fully apart at any height (round 2).' },
  ] },
  { group: 'Your pointer', items: [
    { k: 'cursorLand', type: 'toggle', label: 'Land on a still pointer', def: true,
      hint: 'Hold the pointer still and one spirals in and settles on it, up at the glass, opening and closing now and then. Any move sends it off in an escape burst.' },
    { k: 'holdTime', label: 'Still for', min: 1, max: 10, step: 0.1, def: 3, fmt: sec,
      hint: 'How long the pointer has to stay still (within 2.5 pt) before one comes.' },
    { k: 'clickLimit', label: 'Clicked flowers kept', min: 1, max: 30, step: 1, def: 12, fmt: v => String(v),
      hint: 'Click open ground to bloom a flower (only where it has room). Beyond this many, the oldest one you planted closes and fades over 2 s, and any butterfly on it takes off.' },
    { k: 'answerGap', label: 'One answers a click every', min: 0, max: 20, step: 0.5, def: 5, fmt: sec,
      hint: 'A fresh bloom may call the nearest travelling butterfly (7 in 10), but only one at a time: none while one is still on its way to a bloom it was called to, and none within this long of the last call.' },
  ] },
  { group: 'Small life', items: [
    { k: 'life', label: 'Life when landed', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'Breathing, an antenna twitch now and then, a small shuffle on the flower, a lean in a gust. 0: still as round 2.' },
  ] },
  { group: 'Traces', items: [
    { k: 'downwash', label: 'Wing downwash', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'A low butterfly\'s downstrokes push the air out under it: the grass flickers and lies over beneath it, then settles.' },
    { k: 'nod', label: 'Flowers nod', min: 0, max: 3, step: 0.01, def: 1, fmt: x2,
      hint: 'A landing dips the flower along the butterfly\'s way; a take-off kicks it half as much back; a click on a bloom nods it away from your click.' },
  ] },
  { group: 'Flowers', items: [
    { k: 'density', label: 'Flower density', min: 0.2, max: 3, step: 0.01, def: 0.85, fmt: x2,
      hint: 'How many planted patches across the screen.' },
    { k: 'flowerSize', label: 'Flower size', min: 0.4, max: 2, step: 0.01, def: 1.32, fmt: x2,
      hint: 'Size of the blooms (a daisy is about 11 cells across at 1 ×), the ones you clicked too.' },
    { k: 'leaves', label: 'Leaves', min: 0, max: 2, step: 0.01, def: 0.9, fmt: x2,
      hint: 'The dark rosettes of leaves under each bloom.' },
  ] },
  { group: 'Air and ground', items: [
    { k: 'breeze', label: 'Breeze', min: 0, max: 3, step: 0.01, def: 1.7, fmt: x2,
      hint: 'Gusts that ripple through the grass, sway the flowers and drift the butterflies.' },
    { k: 'shadow', label: 'Shadows', min: 0, max: 1.5, step: 0.01, def: 1, fmt: x2,
      hint: 'How dark the shadows are; a high butterfly casts a fainter, farther one.' },
    { k: 'green', label: 'Green in the ground', min: 0, max: 2.5, step: 0.01, def: 0.69, fmt: x2,
      hint: 'The hints of green in the black ground.' },
    { k: 'grass', label: 'Grass', min: 0, max: 2, step: 0.01, def: 1, fmt: x2,
      hint: 'How many grass marks, and how bright.' },
  ] },
  { group: 'Look', items: [
    { k: 'depth', label: 'Depth', min: 0, max: 2, step: 0.01, def: 1, fmt: v => v < 0.005 ? 'off · flat, as round 4' : x2(v),

    const d = Math.hypot(o.x - src.x, o.y - src.y);

      if (i < 0 || i === last) continue; last = i;

      lGlyph(i, s + step > len ? G['°'] : lineGlyph(dxA, dyA, lineRow(ax, ay, dxA, dyA, cx, cy)), fe[0] * dim, fe[1] * dim, fe[2] * dim, 0.85);
    }
  }
  // Drinking (on a flower or on your pointer): the proboscis, a fine line straight ahead of the head.
  if ((b.state === 'nectar' || b.state === 'cursor') && b.landK >= 1) {
    const ax = POSE.cx + fx * head, ay = POSE.cy + fy * head;
    let last = -1;
    for (let s = 0.55 * cw; s <= 1.05 * cw; s += 0.25 * cw) {
      const x = ax + fx * s, y = ay + fy * s, i = cellOf(x, y);
      if (i < 0 || i === last || wingStamp[i] === stamp) continue; last = i;
      const cx = (i % cols + 0.5) * cw, cy = (Math.floor(i / cols) + 0.5) * ch;
      lGlyph(i, lineGlyph(fx, fy, lineRow(ax, ay, fx, fy, cx, cy)), fe[0] * dim, fe[1] * dim, fe[2] * dim, 0.8);
    }
  }
}

function drawShadow(b) {
  const k0 = set.shadow * (LIGHT ? 0.9 : 0.8) * (1 - 0.55 * b.z);
  if (k0 <= 0.01) return;
  setPose(b, true);
  const sp = b.sp;
  const reach = Math.max(POSE.hs, POSE.hh * 1.5) + cw;
  const c0 = Math.max(0, Math.floor((POSE.cx - reach) / cw)), c1 = Math.min(cols - 1, Math.floor((POSE.cx + reach) / cw));
  const r0 = Math.max(0, Math.floor((POSE.cy - reach) / ch)), r1 = Math.min(rows - 1, Math.floor((POSE.cy + reach) / ch));
  // Softer the higher it flies: the samples spread wider.
  const spread = 0.3 + 0.9 * b.z;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const px = (c + 0.5) * cw, py = (r + 0.5) * ch;
    let cov = 0;
    for (let k = 0; k < 9; k++) if (wingTest(px + SUB9[k][0] * cw * spread * 1.5, py + SUB9[k][1] * ch * spread * 1.5) >= 0) cov++;
    // The body's shadow too.
    const dx = px - POSE.cx, dy = py - POSE.cy, u = dx * POSE.fx + dy * POSE.fy, v = dx * POSE.rx + dy * POSE.ry;
    if (Math.abs(v) < 0.5 * cw && u < 0.4 * POSE.hh && u > -0.78 * POSE.hh) cov = Math.max(cov, 6);
    if (cov) shade(r * cols + c, k0 * cov / 9);
  }
}

function drawDust() {
  const g = LIGHT ? GOLD_PAPER : PI_.gold;
  for (const d of dust) {
    const c = Math.floor(d.x / cw), r = Math.floor(d.y / ch); if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
    const a = clamp(d.life / d.max, 0, 1);
    const twinkle = d.spark ? (hash3(c, r, Math.floor(simT * 6)) < 0.5 ? G['+'] : G['·']) : (a > 0.5 ? G['·'] : G['.']);
    glyphAt(r * cols + c, twinkle, g[0], g[1], g[2], (d.spark ? 1 : 0.8) * a * set_accent());
  }
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  The ground: mainly black, slow patches of green, grass marks that ripple and lean as the gusts pass
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const TUFT_GLYPHS = [G[','], G["'"], G['`'], G['.'], G[','], G["'"], G['·']];
function buildGround() {
  const P = PI_;
  // The ground is the habitat's background: black with hints of green, or the paper with hints of green.
  const bg = LIGHT ? PAPER : [0, 0, 0], gc = LIGHT ? GROUND_PAPER : P.ground;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    const x = c * cw / S, y = r * ch / S;
    const n = 0.6 * vnoise(x / 260, y / 230, 21) + 0.4 * vnoise(x / 90, y / 80, 22);
    const patch = smooth(0.42, 0.82, n);
    const k = clamp(patch * set.green * 1.15, 0, 2);
    groundR[i] = clamp(bg[0] + (gc[0] - bg[0]) * k, 0, 255);
    groundG[i] = clamp(bg[1] + (gc[1] - bg[1]) * k, 0, 255);
    groundB[i] = clamp(bg[2] + (gc[2] - bg[2]) * k, 0, 255);
    const dens = (0.09 + 0.22 * patch + 0.08 * vnoise(x / 40, y / 40, 23)) * set.grass;
    const h = hash3(c, r, 11);
    tuft[i] = h < dens ? TUFT_GLYPHS[Math.floor(hash3(c, r, 5) * TUFT_GLYPHS.length)] : 0;
    tuftK[i] = (0.45 + 0.55 * hash3(c, r, 7)) * (0.55 + 0.45 * patch);
    tuftM[i] = hash3(c, r, 17);   // where a lying blade sits in its cell: ¯ - _
  }
  groundDirty = false;
}

function drawGround() {
  if (groundDirty) buildGround();
  BR.set(groundR); BG.set(groundG); BB.set(groundB); HB.fill(0);
  GI.fill(0);
  const P = PI_, gr = P.grass, st = P.stirred;
  const grassAmt = Math.min(1.4, set.grass);
  farPush(set.depth);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c; const t0 = tuft[i]; if (!t0) continue;
    const x = (c + 0.5) * cw, y = (r + 0.5) * ch;
    windAt(x, y, simT);
    const s = clamp((wind.m / Math.max(1, 26 * S * Math.max(0.3, set.breeze)) - 0.35) / 1.3, 0, 1);
    // In a gust the blades lie over along the wind and catch the light: a bright band rolling across. A lying
    // blade is a silk line, on its own row in the cell.
    let g = t0;
    if (s > 0.45 && hash3(c, r, 13) < 0.25 + 0.6 * s) g = lineGlyph(wind.x, wind.y, tuftM[i]);
    const kk = s * 0.85;
    // On paper: a soft sage ink, a little deeper where a gust lays the blades over; kept below the butterflies.
    if (LIGHT) {
      const a = PAPER_GRASS, z = PAPER_GRASS_STIRRED;
      glyphAt(i, g, a[0] + (z[0] - a[0]) * kk, a[1] + (z[1] - a[1]) * kk, a[2] + (z[2] - a[2]) * kk, 0.75 * tuftK[i] * (0.42 + 0.58 * s) * grassAmt);
    } else lGlyph(i, g, gr[0] + (st[0] - gr[0]) * kk, gr[1] + (st[1] - gr[1]) * kk, gr[2] + (st[2] - gr[2]) * kk,
      tuftK[i] * (0.42 + 0.58 * s) * grassAmt);
  }
  farPush(0);
  drawMotes();
}

/** Gold motes where the pointer stirs the air (the habitat's accent for the pointer breeze): above 60 pt/s of
 *  stirred air, a few empty cells show a gold `·` at up to 0.35 alpha, re-rolling with the shimmer's clock. They fade
 *  as the stirred air dies away (1.6/s), well under a second after the pointer stops. */
function drawMotes() {
  let any = false;
  for (let k = 0; k < PFX.length; k++) if (PFX[k] * PFX[k] + PFY[k] * PFY[k] > 3600) { any = true; break; }
  if (!any) return;
  const g = LIGHT ? GOLD_PAPER : PI_.gold, tick = Math.floor(simT * 2.4);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c; if (GI[i]) continue;
    const gx = clamp((c + 0.5) * cw / PG, 0, pgc - 1.001), gy = clamp((r + 0.5) * ch / PG, 0, pgr - 1.001);
    const ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy, j = iy * pgc + ix;
    const px = (PFX[j] * (1 - fx) + PFX[j + 1] * fx) * (1 - fy) + (PFX[j + pgc] * (1 - fx) + PFX[j + pgc + 1] * fx) * fy;
    const py = (PFY[j] * (1 - fx) + PFY[j + 1] * fx) * (1 - fy) + (PFY[j + pgc] * (1 - fx) + PFY[j + pgc + 1] * fx) * fy;
    const m = Math.hypot(px, py); if (m < 60 * S) continue;
    const k = smooth(60 * S, 180 * S, m);
    if (hash3(c, r, tick + (hash3(c, r, 3) * 3 | 0)) > 0.12 + 0.2 * k) continue;
    glyphAt(i, G['·'], g[0], g[1], g[2], (0.2 + 0.15 * k) * set_accent());
  }
}

function buildGrid() {
  gridCtx.setTransform(1, 0, 0, 1, 0, 0);
  gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
  if (set.grid) {
    // One device pixel at each cell's top and left edge, row and column 0 too (white 5.5 % / ink 8 %).
    gridCtx.fillStyle = LIGHT ? 'rgba(35,35,35,0.08)' : 'rgba(255,255,255,0.055)';
    for (let c = 0; c < cols; c++) gridCtx.fillRect(Math.round(c * cw * DPR), 0, 1, gridCanvas.height);
    for (let r = 0; r < rows; r++) gridCtx.fillRect(0, Math.round(r * ch * DPR), gridCanvas.width, 1);
  }
  gridDirty = false;
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Frame
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

function render() {
  drawGround();
  for (const f of flowers) drawFlower(f);
  const order = flies.slice().sort((a, b) => a.z - b.z);
  for (const b of order) drawShadow(b);
  for (const b of order) drawButterfly(b);
  drawDust();
  blit();
}

function blit() {
  // Calm: dims toward black, or toward the paper in light.
  const bright = set.calm ? 0.62 : 1;
  const pr = LIGHT ? PAPER : [0, 0, 0];
  // 1. The ground (the habitat's background), seamless; under a block cell, the ground it stands on.
  const data = blockImage.data;
  for (let i = 0, j = 0; i < N; i++, j += 4) {
    let r, g, b;
    if (HB[i]) { r = groundR[i]; g = groundG[i]; b = groundB[i]; } else { r = BR[i]; g = BG[i]; b = BB[i]; }
    if (bright !== 1) { r = pr[0] + (r - pr[0]) * bright; g = pr[1] + (g - pr[1]) * bright; b = pr[2] + (b - pr[2]) * bright; }
    data[j] = r; data[j + 1] = g; data[j + 2] = b; data[j + 3] = 255;
  }
  blockCtx.putImageData(blockImage, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(blockCanvas, 0, 0, cols, rows, 0, 0, Math.round(cols * cw * DPR), Math.round(rows * ch * DPR));
  // 2. The grid.
  if (gridDirty) buildGrid();
  if (set.grid) ctx.drawImage(gridCanvas, 0, 0);
  // 3. Blocks, each inset one point from its cell's top-left grid lines (Shaders.swift canvas_main), so each sits
  //    in its own tile with a strip of ground and grid line showing: the family's mosaic.
  const ins = Math.round(DPR);
  let lastStyle = '';
  for (let r = 0; r < rows; r++) {
    const y0 = Math.round(r * ch * DPR) + ins, y1 = Math.round((r + 1) * ch * DPR);
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c; if (!HB[i]) continue;
      let br = BR[i], bg = BG[i], bb = BB[i];
      if (bright !== 1) { br = pr[0] + (br - pr[0]) * bright; bg = pr[1] + (bg - pr[1]) * bright; bb = pr[2] + (bb - pr[2]) * bright; }
      const style = 'rgb(' + (br | 0) + ',' + (bg | 0) + ',' + (bb | 0) + ')';
      if (style !== lastStyle) { ctx.fillStyle = style; lastStyle = style; }
      const x0 = Math.round(c * cw * DPR) + ins;
      ctx.fillRect(x0, y0, Math.round((c + 1) * cw * DPR) - x0, y1 - y0);
    }
  }
  // 4. Glyphs over everything.
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.font = '600 ' + Math.round(ch * 0.74) + 'px "Geist Mono", ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let lastA = -1; lastStyle = '';
  for (let r = 0; r < rows; r++) {
    const y = r * ch + ch / 2 + 1;
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, g = GI[i]; if (!g) continue;
      let a = IA[i]; if (a <= 0.02) continue;
      let ir = IR[i], ig = IG[i], ib = IB[i];
      if (bright !== 1) { ir = pr[0] + (ir - pr[0]) * bright; ig = pr[1] + (ig - pr[1]) * bright; ib = pr[2] + (ib - pr[2]) * bright; }
      const style = 'rgb(' + (ir | 0) + ',' + (ig | 0) + ',' + (ib | 0) + ')';
      if (style !== lastStyle) { ctx.fillStyle = style; lastStyle = style; }
      a = a > 1 ? 1 : a;
      if (a !== lastA) { ctx.globalAlpha = a; lastA = a; }
      ctx.fillText(GL[g], c * cw + cw / 2, y);
    }
  }
  ctx.globalAlpha = 1;
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Pointer: stir the breeze, flush the butterflies near a fast pointer, click to bloom or touch a bloom
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

// x, y: where it is; sx, sy: where the air was last stirred to (stirStep); ax, ay: where it came to rest; down, downId:
// the press a click needs (the primary button's own); held: it moved while paused.
const ptr = { x: 0, y: 0, sx: 0, sy: 0, down: false, downId: -1, moved: 0, has: false, ax: 0, ay: 0, still: 0, held: false };
canvas.addEventListener('pointermove', ui(e => {
  const x = e.clientX, y = e.clientY;
  // The pointer only stirs the air (stirStep, in simulation time); butterflies feel the stirred air (stepFly,
  // stepLanded), they don't see the pointer.
  if (ptr.has) ptr.moved += Math.hypot(x - ptr.x, y - ptr.y);
  else { ptr.ax = x; ptr.ay = y; ptr.still = 0; ptr.sx = x; ptr.sy = y; }
  ptr.x = x; ptr.y = y; ptr.has = true;
  if (paused) { ptr.sx = x; ptr.sy = y; }   // stopped time stirs no air
  // Still means within 2.5 pt of where it came to rest.
  if (Math.hypot(x - ptr.ax, y - ptr.ay) > 2.5) { ptr.ax = x; ptr.ay = y; if (paused) ptr.held = true; else pointerMoved(x, y); }
}));
// A click is the primary button's own press and release on the meadow, moving less than 6 pt between. Anything that
// takes the pointer away (leaving, a cancel, losing capture, the window losing focus) ends the press.
const endPress = () => { ptr.down = false; ptr.downId = -1; };
canvas.addEventListener('pointerdown', e => { if (!e.isPrimary || e.button !== 0) return; ptr.down = true; ptr.downId = e.pointerId; ptr.moved = 0; });
// A click is not holding still: it restarts the still timer and sends off one on (or coming to) the pointer. While
// paused a click does nothing: in stopped time nothing could grow, fade or answer it, so nothing piles up.
canvas.addEventListener('pointerup', ui(e => {
  const mine = ptr.down && e.pointerId === ptr.downId && e.button === 0;
  endPress();
  if (!mine || ptr.moved >= 6 || paused) return;
  pointerMoved(e.clientX, e.clientY); clickAt(e.clientX, e.clientY);
}));
canvas.addEventListener('pointercancel', endPress);
canvas.addEventListener('lostpointercapture', endPress);
window.addEventListener('blur', endPress);
canvas.addEventListener('pointerleave', ui(() => { endPress(); pointerGone(); }));

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  The panel
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
const controlsEl = document.getElementById('controls');
const refresh = {};
function setPanel(open) {
  panel.classList.toggle('hidden', !open);
  toggle.textContent = open ? 'Hide tweaks' : 'Tweaks';
  toggle.setAttribute('aria-expanded', String(open));
}
toggle.addEventListener('click', () => setPanel(panel.classList.contains('hidden')));

const onChange = ui(function onChange(k) {
  // The one cross-rule: Size up close never below Size down; the one you moved takes the other along.
  if (k === 'sizeLow' && set.sizeHigh < set.sizeLow) { set.sizeHigh = set.sizeLow; refresh.sizeHigh(); }
  if (k === 'sizeHigh' && set.sizeLow > set.sizeHigh) { set.sizeLow = set.sizeHigh; refresh.sizeLow(); }
  save();
  if (k === 'count' || k === 'species' || k === 'areaCount') syncFlies();
  if (k === 'clickLimit') limitClicked();
  if (k === 'density' || k === 'flowerSize') replantSoon();
  if (k === 'cursorLand' && !set.cursorLand) for (const b of flies) if (b.goal === 'cursor' && b.state !== 'cursor') giveUpCursor(b);
  if (k === 'green' || k === 'grass') groundDirty = true;
  if (k === 'theme') setTheme();
  if (k === 'grid') gridDirty = true;
  if (k === 'leaves') for (const f of flowers) f.reach = Math.max(f.R * 1.15, ...f.leaves.map(l => l.len * Math.min(1, 0.4 + 0.6 * set.leaves))) + 2 * cw;
});

/** A reset beside a control: back to its default. Dimmed while the control is at its default. */
function addReset(row, label, defText, isDef, reset) {
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'rs'; btn.textContent = '↺';
  btn.title = 'Back to the default: ' + defText;
  btn.setAttribute('aria-label', 'Reset ' + label + ' to its default, ' + defText);
  btn.addEventListener('click', reset);
  row.querySelector('.top').appendChild(btn);
  return () => { btn.disabled = isDef(); };
}

function buildPanel() {
  controlsEl.innerHTML = '';
  for (const g of CONTROLS) {
    const sec = document.createElement('section'); sec.className = 'group';
    const h = document.createElement('h2'); h.textContent = g.group; sec.appendChild(h);
    for (const c of g.items) {
      const row = document.createElement('div'); row.className = 'row';
      if (c.type === 'species') {
        row.innerHTML = '<div class="top"><label>' + c.label + '</label></div>';
        const chips = document.createElement('div'); chips.className = 'chips';
        const ups = [];
        const rs = addReset(row, c.label, 'all four', () => SPECIES_LIST.every(s => set.species[s.key] === DEFAULTS.species[s.key]),
          () => { set.species = { ...DEFAULTS.species }; ups.forEach(u => u()); onChange('species'); });
        for (const s of SPECIES_LIST) {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
          b.innerHTML = '<i style="background:' + s.swatch + '"></i>' + s.label;
          const upd = () => b.classList.toggle('on', !!set.species[s.key]);
          b.addEventListener('click', () => { set.species[s.key] = !set.species[s.key]; ups.forEach(u => u()); onChange('species'); });
          ups.push(upd); chips.appendChild(b);
        }
        ups.push(rs); ups.forEach(u => u());
        refresh.species = ups;
        row.appendChild(chips);
      } else if (c.type === 'choice' || c.type === 'toggle') {
        row.innerHTML = '<div class="top"><label>' + c.label + '</label></div>';
        const chips = document.createElement('div'); chips.className = 'chips';
        const opts = c.type === 'toggle' ? [[true, 'On'], [false, 'Off']] : c.options;
        const ups = [];
        const defText = opts.find(o => o[0] === c.def)[1].toLowerCase();
        ups.push(addReset(row, c.label, defText, () => set[c.k] === c.def, () => { set[c.k] = c.def; ups.forEach(u => u()); onChange(c.k); }));
        for (const [v, lab] of opts) {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = lab;
          const upd = () => b.classList.toggle('on', set[c.k] === v);
          b.addEventListener('click', () => { set[c.k] = v; ups.forEach(u => u()); onChange(c.k); });
          ups.push(upd); chips.appendChild(b);
        }
        ups.forEach(u => u());
        refresh[c.k] = () => ups.forEach(u => u());
        row.appendChild(chips);
        if (c.hint) { const hn = document.createElement('div'); hn.className = 'hint'; hn.textContent = c.hint; row.appendChild(hn); }
      } else {
        const id = 'in-' + c.k;
        row.innerHTML = '<div class="top"><label for="' + id + '">' + c.label + '</label><output></output></div>' +
          '<input type="range" id="' + id + '" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '">' +
          '<div class="hint">' + c.hint + '</div>';
        const input = row.querySelector('input'), out = row.querySelector('output');
        let rs = null;
        const upd = () => {
          input.value = set[c.k]; out.textContent = c.fmt(set[c.k]);
          input.style.setProperty('--p', ((set[c.k] - c.min) / (c.max - c.min) * 100) + '%');
          if (rs) rs();
        };
        rs = addReset(row, c.label, c.fmt(c.def), () => Math.abs(set[c.k] - c.def) < c.step / 2, () => { set[c.k] = c.def; upd(); onChange(c.k); });
        input.addEventListener('input', () => { set[c.k] = +input.value; upd(); onChange(c.k); });
        refresh[c.k] = upd; upd();
      }
      sec.appendChild(row);
    }
    controlsEl.appendChild(sec);
  }
}
function refreshAll() { for (const k in refresh) { const r = refresh[k]; if (Array.isArray(r)) r.forEach(f => f()); else r(); } }

document.getElementById('reset').addEventListener('click', ui(() => {
  set = normalize(null); save(); refreshAll(); setTheme(); syncFlies(); replant(false); groundDirty = true; gridDirty = true;
}));
// A new meadow: every flower new, the clicked ones gone too; butterflies on or bound for a flower take off or turn away.
document.getElementById('replant').addEventListener('click', ui(() => replant(true)));
let paused = false;
const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause'; });
document.getElementById('copy').addEventListener('click', async () => {
  const out = { sketch: 'meadow s1', ...set, species: { ...set.species } };
  const text = JSON.stringify(out, null, 2);
  const btn = document.getElementById('copy');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } ta.remove();
  }
  btn.textContent = ok ? 'Copied' : 'Copy failed';
  setTimeout(() => { btn.textContent = 'Copy settings'; }, 1400);
});
// Shortcuts only outside the controls: on a focused button or slider, Space and the keys do what they do there.
window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input, textarea, select, button, a, [contenteditable]')) return;
  if (e.key === 'h' || e.key === 'H') setPanel(panel.classList.contains('hidden'));
  if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
});

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Replay fixture (for the Swift port)
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//
// `?debug=1&fixture=<name>` (optionally `&seed=N`, default 42) runs one fixed scenario on the sketch's own 1/60 s
// step, with nothing drawn until the end, then holds the last frame (paused) and offers the result as a JSON
// download (a link at the top left), sets `window.__fixture`, and prints it to the console as one line starting
// `MEADOW_FIXTURE ` (for a headless run). Saved and URL settings are ignored; nothing is saved. The run itself is
// the sketch unchanged: the same planting, opening, stepping and pointer handlers a user would drive.
//
// Scenarios:
//   default      the director's defaults (normalize(null)).
//   air-flowers  the defaults with every species off: no butterflies, only the breeze, the pointer's air and the
//                flowers (How many stops at 1; with no species on, the count is 0).
//
// The file (version 1). Units: positions and lengths in CSS pixels, which the sketch calls pt (the canvas is
// W × H of them; S = cell width / 13 scales the meadow's sizes); time in seconds; angles in radians (0 = +x, y
// down); speeds in pt/s. Numbers are rounded to 6 decimals.
//   fixture       1 (the format version)
//   scenario      the scenario's name
//   sketch        'meadow s1'
//   seed          the seed. Two mulberry32 streams come from it: the meadow's own (seed) for planting, flight and
//                 the opening, and the input's (seed ^ 0x5bd1e995) for everything a pointer event causes
//   settings      every setting, normalized (the same keys and values Copy settings gives)
//   viewport      { width, height, dpr, cell: { w, h }, cols, rows, S }: the window the run used
//   step          { dt: 1/60, ticks: 1800 }: one tick is one step(dt) at 1 × (Slow motion 1)
//   trace         the pointer events, in order: { tick, t, type, x, y, id, button }. type is move, down, up or
//                 leave (pointermove, pointerdown, pointerup, pointerleave on the meadow; id 1, primary, a mouse;
//                 button 0 for down and up, -1 otherwise). An event at tick n is delivered after the sample at
//                 tick n and before the step that takes the clock to tick n + 1 (t = n / 60). The trace: the
//                 pointer comes in and moves across (ticks 20–119, about 420 pt/s at 1728 × 1117), holds still
//                 3.5 s (120–330; one comes to it after 3 s, Still for), moves to open ground and clicks it (down
//                 400, up 406), moves to a bloom planted at load and clicks it (down 490, up 496), then a fast
//                 stir pass (570–599: 0.4 of the width in 0.5 s, about 1380 pt/s at 1728 wide), rests, and
//                 leaves (900).
//   points        { ground: [x, y], bloom: [x, y, flowerId], hold: [x, y], stir: [[x, y], [x, y]] }: the trace's
//                 places, chosen at tick 0 from the planted meadow (open ground: the room furthest from any
//                 flower; the bloom: the grown one nearest the middle)
//   samples       at ticks 0 (after load, before any step), 1, 60, 600 and 1800, each:
//     tick, t     the tick and the simulation clock
//     wind        [{ x, y, all: [x, y], landed: [x, y], stir: [x, y] }] at a 4 × 3 grid (x at 1/8, 3/8, 5/8, 7/8
//                 of the width, y at 1/6, 1/2, 5/6 of the height), then the stir pass's start, middle and end,
//                 then the pointer if it is on the meadow. all: everything the grass, flowers, pollen and flight
//                 drift feel (breeze, gusts, the pointer's stir, wings' downwash); landed: what a landed butterfly
//                 feels (no downwash); stir: the pointer's air alone. pt/s.
//     flowers     every flower in draw order: { id, kind, x, y, r, head: [x, y], age }. r: the bloom radius; head:
//                 the head's offset from the centre as it sways; age: 0 when clicked, growing to 1 over 2.2 s
//                 (planted ones start at 1)
//     butterflies every butterfly: { id, species, state, x, y, z, heading, stroke }. state: fly, approach,
//                 nectar, bask or cursor (the sketch's names); z: height, 0 (on the ground) to 1; heading: the
//                 direction it faces; stroke: the wing stroke angle the drawing uses
const FIXTURE_TICKS = [0, 1, 60, 600, 1800];
function runFixture(name) {
  const r6 = v => Math.round(v * 1e6) / 1e6;
  // The trace's places, from the meadow as planted.
  let ground = [0.5 * W, 0.5 * H], room = -1e9;
  for (let i = 0; i <= 20; i++) for (let j = 0; j <= 12; j++) {
    const x = (0.15 + 0.7 * i / 20) * W, y = (0.15 + 0.7 * j / 12) * H;
    let d = 1e9; for (const f of flowers) d = Math.min(d, Math.hypot(f.x - x, f.y - y) - f.R);
    if (d > room) { room = d; ground = [x, y]; }
  }
  let bloom = null, bd = 1e9;
  for (const f of flowers) { const d = Math.hypot(f.x - W / 2, f.y - H / 2); if (!f.fading && !f.clicked && d < bd) { bd = d; bloom = f; } }
  const hold = [0.5 * W, 0.6 * H], stirA = [0.3 * W, 0.75 * H], stirB = [0.7 * W, 0.75 * H];
  const bloomAt = bloom ? [bloom.x, bloom.y] : [0.5 * W, 0.5 * H];
  const trace = [];
  const add = (tick, type, x, y) => trace.push({ tick, t: r6(tick / 60), type, x: r6(x), y: r6(y), id: 1, button: type === 'down' || type === 'up' ? 0 : -1 });
  const path = (t0, t1, a, b) => { for (let k = t0; k < t1; k++) { const u = (k - t0 + 1) / (t1 - t0); add(k, 'move', a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u); } };
  const enter = [0.15 * W, 0.3 * H];
  add(20, 'move', enter[0], enter[1]);
  path(21, 120, enter, hold);                 // in and across, one move a tick
  path(330, 390, hold, ground);               // after the 3.5 s hold, to open ground
  add(400, 'down', ground[0], ground[1]); add(406, 'up', ground[0], ground[1]);
  path(420, 480, ground, bloomAt);
  add(490, 'down', bloomAt[0], bloomAt[1]); add(496, 'up', bloomAt[0], bloomAt[1]);
  path(520, 560, bloomAt, stirA);
  path(570, 600, stirA, stirB);              // the stir pass
  add(900, 'leave', stirB[0], stirB[1]);
  const send = e => {
    const type = { move: 'pointermove', down: 'pointerdown', up: 'pointerup', leave: 'pointerleave' }[e.type];
    canvas.dispatchEvent(new PointerEvent(type, { clientX: e.x, clientY: e.y, pointerId: 1, isPrimary: true, pointerType: 'mouse',
      button: e.button, buttons: e.type === 'down' ? 1 : 0, bubbles: type !== 'pointerleave' }));
  };
  const windPoints = () => {
    const pts = [];
    for (const fy of [1 / 6, 1 / 2, 5 / 6]) for (const fx of [1 / 8, 3 / 8, 5 / 8, 7 / 8]) pts.push([fx * W, fy * H]);
    pts.push(stirA, [(stirA[0] + stirB[0]) / 2, stirA[1]], stirB);
    if (ptr.has) pts.push([ptr.x, ptr.y]);
    return pts;
  };
  const sample = tick => {
    const saved = { ...wind };   // reading the air leaves the sketch's own wind state as it was
    const out = { tick, t: r6(simT),
      wind: windPoints().map(([x, y]) => { windAt(x, y, simT); return { x: r6(x), y: r6(y), all: [r6(wind.x), r6(wind.y)], landed: [r6(wind.ax), r6(wind.ay)], stir: [r6(wind.px), r6(wind.py)] }; }),
      flowers: flowers.map(f => ({ id: f.id, kind: f.kind, x: r6(f.x), y: r6(f.y), r: r6(f.R), head: [r6(f.ox), r6(f.oy)], age: r6(f.age) })),
      butterflies: flies.map(b => ({ id: b.id, species: b.kind, state: b.state, x: r6(b.x), y: r6(b.y), z: r6(b.z), heading: r6(b.heading), stroke: r6(b.stroke) })) };
    Object.assign(wind, saved);
    return out;
  };
  const samples = [];
  let ev = 0;
  const last = FIXTURE_TICKS[FIXTURE_TICKS.length - 1];
  for (let tick = 0; ; tick++) {
    if (FIXTURE_TICKS.includes(tick)) samples.push(sample(tick));
    if (tick === last) break;
    while (ev < trace.length && trace[ev].tick === tick) send(trace[ev++]);
    step(1 / 60);
  }
  const out = { fixture: 1, scenario: name, sketch: 'meadow s1', seed, settings: { ...set, species: { ...set.species } },
    viewport: { width: W, height: H, dpr: DPR, cell: { w: cw, h: ch }, cols, rows, S: r6(S) },
    step: { dt: r6(1 / 60), ticks: last }, trace,
    points: { ground: ground.map(r6), bloom: bloom ? [r6(bloom.x), r6(bloom.y), bloom.id] : null, hold: hold.map(r6), stir: [stirA.map(r6), stirB.map(r6)] },
    samples };
  // One record a line: easy to read and to diff.
  const prim = x => x === null || typeof x !== 'object', flatVal = x => prim(x) || (Array.isArray(x) && x.every(prim));
  const fmt = (v, ind) => {
    if (prim(v)) return JSON.stringify(v);
    if (Object.values(v).every(flatVal)) return JSON.stringify(v).replace(/,"/g, ', "').replace(/":/g, '": ');
    const inner = ind + '  ';
    if (Array.isArray(v)) return '[\n' + v.map(x => inner + fmt(x, inner)).join(',\n') + '\n' + ind + ']';
    return '{\n' + Object.entries(v).map(([k, x]) => inner + JSON.stringify(k) + ': ' + fmt(x, inner)).join(',\n') + '\n' + ind + '}';
  };
  const text = fmt(out, '') + '\n';
  window.__fixture = out; window.__fixtureText = text;
  console.log('MEADOW_FIXTURE ' + JSON.stringify(out));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name + '.json'; a.textContent = 'Download fixture ' + name + '.json';
  a.style.cssText = 'position:fixed;left:12px;top:12px;z-index:9;padding:6px 10px;background:#fff;color:#000;font:12px system-ui;border-radius:6px';
  document.body.appendChild(a);
  paused = true; pauseBtn.textContent = 'Play'; render(); document.body.dataset.ready = '1';
}

// ════════════════════════════════════════════════════════════════════════════════════════════════════════════
//  Start
// ════════════════════════════════════════════════════════════════════════════════════════════════════════════

const statsEl = document.getElementById('stats');
let last = 0, acc = 0, frames = 0, msSum = 0, statT = 0;
function loop(now) {
  const real = last ? Math.min(0.1, (now - last) / 1000) : 1 / 60;
  last = now;
  if (!paused) {
    // Fixed 60 Hz steps at 1 ×; slow motion takes the same steps, shortened.
    acc += real * set.timeScale;
    const h = 1 / 60 * Math.min(1, set.timeScale);
    let n = 0;
    while (acc >= h && n < 8) { step(h); acc -= h; n++; }
    if (n === 8) acc = 0;
  }
  const t0 = performance.now();
  render();
  msSum += performance.now() - t0; frames++;
  if (now - statT > 1000) { statsEl.textContent = (msSum / frames).toFixed(1) + ' ms · ' + flies.length + ' · ' + flowers.length + ' fl'; frames = 0; msSum = 0; statT = now; }
  requestAnimationFrame(loop);
}

function start() {
  resize();
  setTheme();
  plant();
  syncFlies(true);
  openingMoment();
  buildPanel();
  setPanel(params.has('panel') ? params.get('panel') !== '0' : window.innerWidth > 900);
  // ?warm=S runs S seconds of meadow before the first frame (for screenshots); ?freeze=1 holds it there.
  if (params.get('debug') === '1') window.__meadow = { step, render, clickAt: ui(clickAt), syncFlies: ui(syncFlies), onChange, replant: ui(replant), depthScale,
    get flies() { return flies; }, get flowers() { return flowers; }, get set() { return set; }, get t() { return simT; }, get ptr() { return ptr; },
    get dust() { return dust; }, get paused() { return paused; }, get W() { return W; }, get H() { return H; }, get S() { return S; }, wind, windAt, get DWX() { return DWX; }, get PFX() { return PFX; }, get PFY() { return PFY; } };
  if (FIXTURE) {
    if (FIXTURE in FIXTURE_SETTINGS) { runFixture(FIXTURE); return; }
    console.warn('Unknown fixture "' + FIXTURE + '"; known: ' + Object.keys(FIXTURE_SETTINGS).join(', '));
  }
  // ?sheet=flowers or ?sheet=flies lays out every kind for a close look (a development aid).
  const sheet = params.get('sheet');
  if (sheet === 'flowers') {
    flies = []; flowers = [];
    KINDS.forEach((k, i) => { const f = makeFlower(k, W * (0.14 + 0.24 * (i % 4)), H * (i < 4 ? 0.28 : 0.72), true); f.R = KIND[k].r * S * set.flowerSize * 1.05; flowers.push(f); });
    paused = true; render(); document.body.dataset.ready = '1'; return;
  }
  if (sheet === 'flies') {
    flowers = []; flies = [];
    const kinds = ['monarch', 'morpho', 'swallowtail', 'white'], phases = [0, 1.2, 2.2, 3.4];
    kinds.forEach((k, j) => phases.forEach((ph, i) => {
      const b = makeFly(k); b.x = W * (0.13 + 0.25 * i); b.y = H * (0.13 + 0.245 * j); b.heading = -Math.PI / 2 + (j % 2 ? 0.5 : -0.3);
      b.phase = ph; b.stroke = b.sp.mid + b.sp.amp * Math.cos(ph); b.z = +(params.get('z') || 0.5); b.zs = b.z; flies.push(b);
    }));
    paused = true; render(); document.body.dataset.ready = '1'; return;
  }
  const warm = clamp(+(params.get('warm') || 0) || 0, 0, 600);   // at most 10 minutes of warm-up
  for (let t = 0; t < warm; t += 1 / 60) step(1 / 60);
  if (params.get('freeze') === '1') { paused = true; pauseBtn.textContent = 'Play'; render(); document.body.dataset.ready = '1'; return; }
  requestAnimationFrame(loop);
}
window.addEventListener('resize', ui(() => {
  const oldW = W, oldH = H; resize();
  // A pointer the new screen no longer holds has gone; a landed one now off the screen takes off.
  if (ptr.has && (ptr.x < 0 || ptr.y < 0 || ptr.x > W || ptr.y > H)) pointerGone();
  for (const b of flies) if (isLanded(b) && b.state !== 'cursor' && (b.x < 0 || b.y < 0 || b.x > W || b.y > H)) takeOff(b);
  if (Math.abs(W - oldW) > 80 || Math.abs(H - oldH) > 80) replant(false);
  if (set.areaCount) syncFlies();
}));

const fontReady = document.fonts && document.fonts.load ? document.fonts.load('600 14px "Geist Mono"') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(start, start);
})();
</script>
</body>
